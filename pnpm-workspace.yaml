packages:
  - "packages/*"
  - "apps/server"
  - "apps/web"

# 共享依赖版本单一真源（V3.0）：同一依赖在多个包出现时只在这里声明一次，
# 各包用 "catalog:" 引用，避免 zod / @types/node / tsx / pg 等版本漂移。
# 只收「被 2 个及以上包引用」或「跨包必须同版本」的依赖；单包专用依赖仍留在各自 package.json。
catalog:
  zod: ^4.6.7
  typescript: ^5.9.0
  "@types/node": ^22.10.0
  tsx: ^4.19.2
  pg: ^8.13.1
  "@types/pg": ^8.11.10
  drizzle-orm: ^0.45.4
  better-auth: ^1.7.15
  hono: ^4.13.21

overrides:
  "@esbuild-kit/core-utils>esbuild": "0.25.12"

# 仅允许 esbuild 安装平台二进制；未经审查的新构建脚本默认让安装失败。
allowBuilds:
  esbuild: true

minimumReleaseAgeExclude:
  - "@hono/node-server@2.1.6"
  - hono@4.13.21
