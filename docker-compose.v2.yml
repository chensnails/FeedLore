# FeedLore v2 —— 测试栈（部署在 172.26.1.2，与 1.7.4 正式栈并存）
#
# 用法（在 172.26.1.2 的 /root/FeedLore-v2 目录）：
#   docker compose -f docker-compose.v2.yml up -d --build
#   docker compose -f docker-compose.v2.yml logs -f v2-server
#
# 安全边界（重要）：
# - 镜像是**本地构建**的 feedlore-v2:test，不推 ghcr，绝不会污染 ghcr latest；
#   因此 172.26.1.1 生产站（watchtower 拉 ghcr latest）完全不受影响。
# - 本机 watchtower 开了 WATCHTOWER_LABEL_ENABLE=true，只更新带
#   com.centurylinklabs.watchtower.enable=true 标签的容器；本栈**不打该标签**，不会被接管。
# - v2 使用独立的库与卷（feedlore_v2），与 1.7.4 的数据物理隔离。
# - V2_AUTH_DISABLED=1 是 P3 临时开关（better-auth 尚未接入），正式接入后必须去掉。

x-server-build: &server-build
  context: .
  dockerfile: apps/server/Dockerfile

services:
  v2-db:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: feedlore_v2
      POSTGRES_USER: feedlore_v2
      # 测试库口令（仅本机测试用，非生产凭据）
      POSTGRES_PASSWORD: "Wt-BdNHT_W352iukuWhF1ax0"
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - v2-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U feedlore_v2 -d feedlore_v2"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  # one-shot：把 drizzle 迁移跑到最新。重复执行是幂等的（已应用的会跳过）。
  v2-migrate:
    build: *server-build
    image: feedlore-v2:test
    command: sh -c "cd /app/packages/db && pnpm migrate"
    environment:
      DATABASE_URL: postgres://feedlore_v2:Wt-BdNHT_W352iukuWhF1ax0@v2-db:5432/feedlore_v2
    depends_on:
      v2-db:
        condition: service_healthy
    restart: "no"

  v2-server:
    build: *server-build
    image: feedlore-v2:test
    environment:
      DATABASE_URL: postgres://feedlore_v2:Wt-BdNHT_W352iukuWhF1ax0@v2-db:5432/feedlore_v2
      PORT: "3000"
      # ---- better-auth（P4 起真实鉴权，已移除 V2_AUTH_DISABLED 开关）----
      AUTH_SECRET: "96Y2O14RO6F66oprqg6a8TgdTdnqDv8oIayEFm74458"
      # 外部访问地址，务必与实际访问方式一致，否则回调/Cookie 域不匹配
      AUTH_BASE_URL: "http://172.26.1.2:3211"
      AUTH_TRUSTED_ORIGINS: "http://172.26.1.2:3211"
      # ⚠️ 纯 HTTP 环境必须留空/非 1：secure Cookie 在 HTTP 下不会被回传，
      #    表现为「登录成功但后续仍 401」。走 HTTPS 反代时改为 "1"。
      AUTH_SECURE_COOKIES: "0"
      REFRESH_MINUTES: "30"
      KEEP_DAYS: "90"
    ports:
      - "3211:3000"
    depends_on:
      v2-db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  v2-pgdata:
