# FeedLore 2.x —— 发布态 Compose（全新安装 / 版本升级）
#
# 用法（存成默认名 docker-compose.yml，之后不用再写 -f）：
#   mkdir -p feedlore && cd feedlore
#   curl -fsSL -o docker-compose.yml https://raw.githubusercontent.com/chensnails/FeedLore/main/docker-compose.v2.release.yml
#   V2_IMAGE=ghcr.io/chensnails/feedlore:3.0.1 docker compose up -d
#   docker compose ps                      # 三个容器都 up / healthy 即部署完成
#
# 国内：compose 走 https://gh-proxy.org/https://raw.githubusercontent.com/...
#      镜像换成 ghcr.nju.edu.cn/chensnails/feedlore:<版本>，同样不需要手动 pull + tag。
#
# 零配置：不需要 .env。数据库密码、更新令牌都有仅在容器网络内使用的默认值；
# 共享主机/多容器环境建议覆盖 PG_PASSWORD 与 WATCHTOWER_HTTP_API_TOKEN。
# 库名统一 feedlore_v2：全新安装由 postgres 直接建该库，老站点的既有卷原样沿用
# （POSTGRES_DB 只在空数据目录初始化时生效，改不动已有库）。
# 空站点首次启动自动建管理员：初始密码固定为 Admin2026，登录后**必须先改密**
# 才能使用其他功能（服务端强制）；升级部署不会动已有账号的密码，也不要求改密。
# 忘记密码：docker exec -it feedlore initial-password --reset
#
# 升级到新版：默认镜像钉版本号（ghcr.io/chensnails/feedlore:3.0.1），不自己漂移；
# 改 V2_IMAGE 后 up -d。想跟 latest 滚动就设为 ghcr.io/chensnails/feedlore:latest，
# app 带 watchtower 标签，Watchtower / 设置页「一键更新」会自动重建。
# 结构迁移由 app 启动自举完成（幂等），失败只告警不阻断；无 DDL 权限的外部库
# 需手工 `pnpm --filter @feedlore/db migrate`。
#
# 对外地址：在 .env 设 PUBLIC_URL=https://你的域名（或 http://IP:3210），
# 首启横幅就显示它；不参与鉴权。HTTPS 反代设 AUTH_SECURE_COOKIES=1，
# 纯 HTTP 保持 0（否则浏览器不回传 Cookie）。
#
# 硬约束：TZ=UTC —— v2 的 timestamp 列按 UTC 壁钟存值，改时区历史时间整体偏移。

name: feedlore

services:
  # ---------------------------------------------------------------
  # 专用 PostgreSQL（沿用既有卷 feedlore-pgdata，不重建）
  # ---------------------------------------------------------------
  db:
    image: postgres:18.4-alpine
    container_name: feedlore-db
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      # 与 app 连的库同名（feedlore_v2）：全新安装时由 postgres 直接建好，
      # 老站点已有卷不受影响（POSTGRES_DB 只在空数据目录初始化时生效）。
      POSTGRES_DB: ${PG_DB:-feedlore_v2}
      POSTGRES_USER: ${PG_USER:-feedlore}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-feedlore}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # 固定探 postgres 库：库名被改过 / 目标库尚未建立时，也不会把 db 判成不健康
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - feedlore
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------
  # 应用：db 健康即启动；结构迁移由 app 启动自举完成（幂等）
  # ---------------------------------------------------------------
  app:
    image: ${V2_IMAGE:-ghcr.io/chensnails/feedlore:3.0.1}
    container_name: feedlore
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # ⚠️ 不要改成 Asia/Shanghai：v2 的 timestamp 列按 UTC 壁钟存值
      TZ: UTC
      PORT: "3000"
      # 目标库与 db 的 POSTGRES_DB 同名（默认 feedlore_v2）；改库名时两个变量一起改
      DATABASE_URL: postgres://${PG_USER:-feedlore}:${PG_PASSWORD:-feedlore}@db:5432/${V2_DB_NAME:-feedlore_v2}

      # ---- better-auth（都可留空）----
      AUTH_SECRET: ${AUTH_SECRET:-}
      AUTH_BASE_URL: ${AUTH_BASE_URL:-}
      # 非必填：需要额外信任的来源（反代域名 / IP 两种访问方式都开）时逗号分隔
      AUTH_TRUSTED_ORIGINS: ${AUTH_TRUSTED_ORIGINS:-}
      # 纯 HTTP 必须为 0：Secure Cookie 在 HTTP 下不会被浏览器回传，表现为「登录成功但仍未登录」
      AUTH_SECURE_COOKIES: ${AUTH_SECURE_COOKIES:-0}
      # 公开注册默认关闭（空值即关闭）；=1 才放行 /api/auth/sign-up
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-}

      # ---- 初始管理员（仅空站点首次启动生效）----
      # 不填 ADMIN_PASS 时用固定的 Admin2026，登录后强制改密；
      # 填了就用你指定的密码，同样要求首次登录后改掉。
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASS: ${ADMIN_PASS:-}
      # 对外访问地址：只用于首启横幅与登录链接提示，不参与鉴权。
      # 反代/局域网访问时填真实地址，例如 https://feed.example.com 或 http://192.168.1.10:3210
      PUBLIC_URL: ${PUBLIC_URL:-}

      # ---- 出网安全 / 反代 ----
      ALLOW_PRIVATE_HOSTS: "${ALLOW_PRIVATE_HOSTS:-}"
      TRUST_PROXY: "${TRUST_PROXY:-}"

      # ---- 启动严格模式（V3.0）----
      # 默认（空/0）：配置格式错误、DB 不可达即拒绝启动；结构迁移失败只告警继续
      # （兼容无 DDL 权限的外部托管库）。=1 时迁移失败也拒绝启动，适合有 DDL 权限、
      # 要求「启动即结构一致」的自托管部署。
      STRICT_BOOT: "${STRICT_BOOT:-}"

      # ---- 日志（V3.3）----
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      LOG_PRETTY: "${LOG_PRETTY:-}"

      # ---- 设置页「一键更新」：转发给同项目的 watchtower ----
      UPDATE_WEBHOOK_URL: http://watchtower:8080/v1/update
      UPDATE_WEBHOOK_TOKEN: ${WATCHTOWER_HTTP_API_TOKEN:-feedlore-update}

      # ---- 采集默认值（仅新库首次落库时生效；迁移过的站点以 settings.source 为准）----
      REFRESH_MINUTES: ${REFRESH_MINUTES:-30}
      KEEP_PER_FEED: ${KEEP_PER_FEED:-300}
      KEEP_DAYS: ${KEEP_DAYS:-90}
      # 抓取与模型调用的出网代理（http/https）；同样只在首次落库时作为默认值
      PROXY_URL: ${PROXY_URL:-}
    ports:
      - "${HOST_PORT:-3210}:3000"
    labels:
      # 默认镜像钉的是版本号，Watchtower 拉到同一 tag 不会产生变化；
      # 把 V2_IMAGE 改成 ghcr.io/chensnails/feedlore:latest 才会滚动升级。
      # 「设置 → 关于 → 一键更新」也依赖这个标签。
      com.centurylinklabs.watchtower.enable: "true"
    networks:
      - feedlore
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------
  # Watchtower：只更新带 enable 标签的容器，即本文件里的 app。
  # ---------------------------------------------------------------
  watchtower:
    image: containrrr/watchtower:1.7.1
    container_name: feedlore-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      TZ: Asia/Shanghai
      WATCHTOWER_LABEL_ENABLE: "true"
      DOCKER_API_VERSION: "1.44"
      WATCHTOWER_POLL_INTERVAL: "300"
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_HTTP_API_UPDATE: "true"
      WATCHTOWER_HTTP_API_PERIODIC_POLLS: "true"
      WATCHTOWER_HTTP_API_TOKEN: ${WATCHTOWER_HTTP_API_TOKEN:-feedlore-update}
    networks:
      - feedlore
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  feedlore:
    name: feedlore
    driver: bridge

volumes:
  pgdata:
    name: feedlore-pgdata
