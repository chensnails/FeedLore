# FeedLore 2.x —— 发布态 Compose（镜像模式，手动/受控升级 + 全新安装）
#
# 完整步骤、验证与回滚见仓库根 **UPGRADE-v2.md**。
#
# 谁需要这份文件：
#   A. 1.x 站点且**开着 Watchtower**（1.x 默认镜像的部署方式）→ **什么都不用做**，
#      2.x 正式版把 feedlore:latest 移走后 Watchtower 会自动换镜像，v2 启动时自举
#      （建 feedlore_v2、迁移数据、校验、改成 UTC），用户不用改配置。
#   B. 想手动/分步升级、或没有 Watchtower → 用本文件：upgrade 一次性服务先迁移，
#      成功后才替换应用容器（这期间 1.x 仍在线）。
#   C. 全新安装 → 也用它（upgrade 会按「空站点」跳过数据迁移）。**零配置**：
#      不需要 .env、不需要填任何变量，直接 up -d；空站点首次启动自动创建
#      初始管理员 admin/admin（请登录后立即改密）。
#
# 零配置默认值（都只在本机容器网络内使用，共享主机/多容器环境建议覆盖）：
#   PG_PASSWORD=feedlore、WATCHTOWER_HTTP_API_TOKEN=feedlore-update
#   已有 1.x 站点升级时**必须沿用原来的 PG_PASSWORD**，否则连不上旧库。
#
# 与 1.x 的 docker-compose.release.yml **同一个 compose 项目**（name: feedlore），
# 复用现有的数据卷（feedlore-pgdata）、网络和端口：
# v2 用同一台 Postgres 实例里的**新库**（默认 feedlore_v2），1.x 的库原样保留，
# 数据迁移只读 1.x、写入新库，随时可以回退。
#
# 手动升级步骤（在 1.x 的部署目录里）：
#   1) 备份（可选；upgrade 也会在实例内留一份 <库名>_backup 快照）：
#        docker exec feedlore-db pg_dump -U "${PG_USER:-feedlore}" -d "${PG_DB:-feedlore}" -Fc > feedlore-v1.dump
#   2) docker compose -f docker-compose.v2.release.yml up -d
#      → upgrade 一次性服务先建库、跑结构迁移、迁移数据、校验；
#        这期间 1.x 应用仍然在线；成功后才替换应用容器（停机 ≈ 重建容器的几秒）。
#   3) docker compose -f docker-compose.v2.release.yml logs upgrade    查看迁移结果
#
# 升级到 v2 之后怎么更新：
#   - 镜像默认钉版本号（feedlore:2.0.2），不会自己漂移；换版本改 V2_IMAGE 后 up -d。
#   - 想跟着 latest 滚动：把 V2_IMAGE 设为 ghcr.io/chensnails/feedlore:latest。
#     app 带 watchtower 标签，Watchtower 会自动重建；设置页「一键更新」也走它。
#
# 回滚（切换后写入 v2 的数据不会回流到 1.x）：
#   docker compose -f docker-compose.release.yml up -d
#   （用 1.x 的 compose 重新拉起 1.x；1.x 的库与卷从未被写过）
#
# 硬约束（都踩过坑，别改）：
# - upgrade 与 app 固定 TZ=UTC。1.x 是 timestamptz、v2 是 timestamp，且 1.x 的
#   Postgres 容器时区是 Asia/Shanghai；upgrade 会把 v2 库的库级时区也钉成 UTC，
#   否则 defaultNow() 写出来的时间整体偏 8 小时。
# - AUTH_SECRET / AUTH_BASE_URL 都**可以留空**：前者自动生成并持久化到 v2 库，
#   后者缺省时按访问请求的 Host 做同源校验（登录/登出不再被 Origin 拦截）。
#   显式填写仍优先——多域名/反代改写 Host 的部署建议填 AUTH_BASE_URL。
# - 走 HTTPS 反代时设 AUTH_SECURE_COOKIES=1；纯 HTTP 保持 0，否则浏览器不回传 Cookie。
# - v1 容器的名字/端口/库名都沿用默认（feedlore / 3210 / feedlore），
#   改过的话同步改这里以及 .env 里的 PG_*。

name: feedlore

services:
  # ---------------------------------------------------------------
  # 专用 PostgreSQL —— 与 1.x 完全一致（配置一字不改，避免容器被重建）
  # ---------------------------------------------------------------
  db:
    image: postgres:18.4-alpine
    container_name: feedlore-db
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      POSTGRES_DB: ${PG_DB:-feedlore}
      POSTGRES_USER: ${PG_USER:-feedlore}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-feedlore}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - feedlore
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------
  # 一次性升级任务：建库 → drizzle 结构迁移 → v1 数据迁移 → 图片缓存 → 校验
  #
  # - 幂等：成功后在 v2 库写 settings.v1Upgrade 标记，重复执行只跑结构迁移
  # - 失败即非零退出 → app 的 depends_on 会把它挡在启动之前，1.x 继续服务
  # - 每次 up 都会执行：兼作后续版本的数据库结构迁移
  # - 1.x 开着 Watchtower 时不需要它：app 启动自举会做同样的事
  # ---------------------------------------------------------------
  upgrade:
    image: &v2-image ${V2_IMAGE:-ghcr.io/chensnails/feedlore:2.0.2}
    container_name: feedlore-upgrade
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      TZ: UTC
      # 源：1.x 的库（只读）。目标：同一实例里的新库，必须不同名。
      LEGACY_DATABASE_URL: postgres://${PG_USER:-feedlore}:${PG_PASSWORD:-feedlore}@db:5432/${PG_DB:-feedlore}
      DATABASE_URL: postgres://${PG_USER:-feedlore}:${PG_PASSWORD:-feedlore}@db:5432/${V2_DB_NAME:-feedlore_v2}
      # 可留空：缺失时 upgrade 会自动生成并写入 v2 库，app 启动时读同一枚
      AUTH_SECRET: ${AUTH_SECRET:-}
      # 图片缓存体积大时可设 1 跳过（v2 会按需重新回源）
      UPGRADE_SKIP_IMAGE_CACHE: ${UPGRADE_SKIP_IMAGE_CACHE:-}
    command: ["pnpm", "--filter", "@feedlore/server", "upgrade:v1"]
    networks:
      - feedlore
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------
  # 应用：upgrade 成功后才启动/替换 1.x 的 app 容器
  # ---------------------------------------------------------------
  app:
    image: *v2-image
    container_name: feedlore
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      upgrade:
        condition: service_completed_successfully
    environment:
      # ⚠️ 不要改成 Asia/Shanghai：v2 的 timestamp 列按 UTC 壁钟存值
      TZ: UTC
      PORT: "3000"
      DATABASE_URL: postgres://${PG_USER:-feedlore}:${PG_PASSWORD:-feedlore}@db:5432/${V2_DB_NAME:-feedlore_v2}

      # ---- better-auth（都可留空）----
      AUTH_SECRET: ${AUTH_SECRET:-}
      AUTH_BASE_URL: ${AUTH_BASE_URL:-}
      # 非必填：需要额外信任的来源（反代域名 / IP 两种访问方式都开）时逗号分隔
      AUTH_TRUSTED_ORIGINS: ${AUTH_TRUSTED_ORIGINS:-}
      # 纯 HTTP 必须为 0：Secure Cookie 在 HTTP 下不会被浏览器回传，表现为「登录成功但仍未登录」
      AUTH_SECURE_COOKIES: ${AUTH_SECURE_COOKIES:-0}

      # ---- 初始管理员（仅空站点首次启动生效；默认 admin/admin）----
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASS: ${ADMIN_PASS:-admin}

      # ---- 出网安全 / 反代（与 1.x 同名参数，直接沿用）----
      ALLOW_PRIVATE_HOSTS: "${ALLOW_PRIVATE_HOSTS:-}"
      TRUST_PROXY: "${TRUST_PROXY:-}"

      # ---- 设置页「一键更新」：转发给同项目的 watchtower ----
      UPDATE_WEBHOOK_URL: http://watchtower:8080/v1/update
      UPDATE_WEBHOOK_TOKEN: ${WATCHTOWER_HTTP_API_TOKEN:-feedlore-update}

      # ---- 采集默认值（仅新库首次落库时生效；迁移过的站点以 settings.source 为准）----
      REFRESH_MINUTES: ${REFRESH_MINUTES:-30}
      KEEP_PER_FEED: ${KEEP_PER_FEED:-300}
      KEEP_DAYS: ${KEEP_DAYS:-90}
    ports:
      - "${HOST_PORT:-3210}:3000"
    labels:
      # 默认镜像钉的是版本号，Watchtower 拉到同一 tag 不会产生变化；
      # 把 V2_IMAGE 改成 ghcr.io/chensnails/feedlore:latest 才会滚动升级。
      # 「设置 → 关于 → 一键更新」也依赖这个标签。
      com.centurylinklabs.watchtower.enable: "true"
    networks:
      - feedlore
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------
  # Watchtower：保留 1.x 的容器（同配置不会被重建）。只更新带 enable 标签的容器，
  # 也就是本文件里的 app（以及升级前 1.x 的 app —— 零配置升级正是靠它）。
  # ---------------------------------------------------------------
  watchtower:
    image: containrrr/watchtower:1.7.1
    container_name: feedlore-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      TZ: Asia/Shanghai
      WATCHTOWER_LABEL_ENABLE: "true"
      DOCKER_API_VERSION: "1.44"
      WATCHTOWER_POLL_INTERVAL: "300"
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_HTTP_API_UPDATE: "true"
      WATCHTOWER_HTTP_API_PERIODIC_POLLS: "true"
      WATCHTOWER_HTTP_API_TOKEN: ${WATCHTOWER_HTTP_API_TOKEN:-feedlore-update}
    networks:
      - feedlore
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  feedlore:
    name: feedlore
    driver: bridge

volumes:
  pgdata:
    name: feedlore-pgdata
