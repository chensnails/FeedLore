name: Release (test branch)

# test 分支专用：每次 push 到 test 出一个双架构 `:test` 镜像，供先行试用。
#
# 与 release.yml 的三处关键区别：
#   1. 只打 `:test`，绝不碰 `:latest` / 版本号标签 —— 生产部署（docker-compose.release.yml）不受影响；
#   2. 不建 GitHub Release —— 试用版没有发布说明，别污染 Releases 列表；
#   3. 前面挂一个 test job，测试不过就不推镜像 —— 否则坏代码会直接被 Watchtower 拉到本机。
#
# 性能沿用 release.yml：两个原生架构 runner 平行构建（各约 40 秒），
# 最后 merge job 用 imagetools 把两个 digest 合成一条多架构清单。
#
# 试用：docker compose -f docker-compose.test.yml up -d

on:
  push:
    branches: [test]

permissions:
  contents: read
  packages: write

env:
  REGISTRY_IMAGE: ghcr.io/chensnails/feedlore

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建前端
        run: npm run build

      - name: UI 回归测试
        run: npm run test:ui

      - name: 后端单测 + 静态校验
        run: npm run test:server

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送（${{ matrix.platform }}，按 digest）
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true
          cache-from: type=gha,scope=test-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=test-${{ matrix.platform }}

      # digest 是字符串不是文件路径，必须先落成文件再上传（同 release.yml）
      - name: 导出 digest 到文件
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          echo "${{ steps.build.outputs.digest }}" > "${{ runner.temp }}/digests/digest-${{ strategy.job-index }}.txt"

      - name: 上传 digest
        uses: actions/upload-artifact@v4
        with:
          name: test-digest-${{ strategy.job-index }}
          path: ${{ runner.temp }}/digests/digest-${{ strategy.job-index }}.txt
          retention-days: 1
          if-no-files-found: error

  merge:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: 下载各架构 digest
        uses: actions/download-artifact@v4
        with:
          path: digests
          pattern: test-digest-*
          merge-multiple: true

      - name: 登录 ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 合并 manifest（只打 :test）
        run: |
          set -euo pipefail
          refs=""
          for f in digests/digest-*.txt; do
            refs="$refs ${{ env.REGISTRY_IMAGE }}@$(tr -d '[:space:]' < "$f")"
          done
          echo "merging:$refs"
          docker buildx imagetools create $refs --tag "${{ env.REGISTRY_IMAGE }}:test"
          docker buildx imagetools inspect "${{ env.REGISTRY_IMAGE }}:test"
