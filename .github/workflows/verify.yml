name: Verify

# 可复用检查工作流：CI（每次 push/PR）与 Release（打 tag）共用同一套闸门。
#
# 抽出来的原因：发布曾经只校验 tag 形态就直接构建镜像，红代码/旧代码照样能推成
# latest；而如果复制一份检查步骤到 release.yml，两边迟早漂移（CI 新加的门禁
# 发布侧不受约束）。这里保持**单一定义**，谁调用都跑一样的检查。
#
# 内容包括：六个包 tsc、纯函数单测 + 契约自检、真库迁移 + 接口级集成测试、
# 前端构建 + 产物校验、镜像构建 + 产物/Node 运行时下限校验。
on:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04 # 必须 pin：ubuntu-latest 曾静默迁到 26.04 导致构建失败
    # 接口级测试要一个真 Postgres。版本钉死到与测试栈/生产同一条线（18.4），
    # 否则「本地/CI 用 16，线上 18」会在 collation、generated column 这类地方悄悄分叉。
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_DB: feedlore_itest
          POSTGRES_USER: feedlore_v2
          POSTGRES_PASSWORD: ci-not-a-secret # 只活在单次 runner 内，容器随 job 销毁
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U feedlore_v2 -d feedlore_itest"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4

      # pnpm 要在 setup-node 之前就位，否则 `cache: pnpm` 找不到 pnpm 可执行文件
      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 生产依赖安全审计
        run: pnpm audit --prod --registry=https://registry.npmjs.org --audit-level=moderate

      # V3.4：lint + format 单一入口。全仓一次性格式化后作为硬门禁；
      # CSS 被 biome.json 排除（其源码文本守卫按字面匹配，格式化会误伤）。
      - name: 代码规范检查（Biome）
        run: pnpm run lint

      # V4.0：CSS 分片是真相源，style.css / hig.css 是按固定顺序聚合的产物。
      # 首屏骨架插件与 73 项 UI 守卫都读聚合产物，所以必须保证分片重新聚合后
      # 与提交的产物逐字节一致 —— 否则改了分片忘了重新生成，CI 照样绿。
      - name: CSS 分片与聚合产物一致性
        run: pnpm run css:check

      # 六个包逐个 tsc --noEmit。注意它守不住「契约 path 字面量被拓宽」这类问题
      # （P7 的真坑：服务端全绿、前端 hc 却缺路由），所以真正的守门是下面两步。
      - name: 类型检查
        run: pnpm -r run typecheck

      # 纯函数单测 + 契约自检。守的是 tsc 看不见的那一类：
      # 过滤/解析的边界行为、SSRF 判定（198.18 必须放行）、OPML 往返、
      # 以及「契约 path 被拓宽成 string 导致端点静默不进 AppType」。
      #
      # ⚠️ 这一步刻意**不给 DATABASE_URL**：单元测试必须是自足的。
      #    给了库地址，接口级测试会在这里也跑一遍，而一旦它因为连不上库而失败，
      #    你就分不清「逻辑算错了」还是「环境没起好」。
      - name: 单元测试（不连库）
        run: pnpm -r run test
        env:
          DATABASE_URL: ""

      # 真库 + 真鉴权 + 契约校验。守的是「只有装起来才暴露」的那类：
      # better-auth 的 usePlural / display_username、纯 HTTP 下的 secure Cookie、
      # 带 Cookie 的请求缺 Origin 被 403、cuid 主键与契约 IdSchema 不匹配 …
      - name: 数据库迁移
        run: pnpm --filter @feedlore/db run migrate
        env:
          DATABASE_URL: postgres://feedlore_v2:ci-not-a-secret@127.0.0.1:5432/feedlore_itest

      # V3.2：跑**整个集成层**，不再只点名 api.integration.test.ts。
      # 之前 entryAi.integration.test.ts 在单测阶段因 DATABASE_URL='' 被跳过、
      # 真库阶段又没被点名 —— 这套 AI 长任务的回归实际上从未进过 CI。
      - name: 接口级集成测试（真库，全部）
        run: pnpm --filter @feedlore/server run test:integration
        env:
          DATABASE_URL: postgres://feedlore_v2:ci-not-a-secret@127.0.0.1:5432/feedlore_itest

      - name: 构建前端
        run: pnpm --filter @feedlore/web run build

      # 查的是**打包之后**的事实：PWA 文件有没有进产物、资源带不带哈希、
      # 触屏媒体查询有没有被工具链吞掉。单测跑源码，这些它看不到。
      - name: 校验前端产物
        run: node scripts/verify-dist.mjs

      # 发布同时出 amd64 与 arm64 镜像；只在这里构建 tag 才做的架构，坏了要等到
      # 发布才发现。arm64 用 QEMU 模拟构建（只验证可构建，不 load）；缓存按架构
      # 分开 scope，避免两种指令集的层互相覆盖。
      - name: 准备多架构构建（arm64 走 QEMU）
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 构建镜像（amd64，不推送）
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: feedlore:ci
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=amd64

      - name: 构建镜像（arm64，不推送）
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: false
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,mode=max,scope=arm64

      # 镜像构建成功但产物没拷对，是「容器起来就 404」的经典原因；
      # 这一步只查最关键的事实：前端产物在、server 入口在、workspace 包链接在。
      #
      # ⚠️ workspace 包链接在**依赖它的那个包**下面，不在根。pnpm 是隔离布局：
      #    根 package.json 一个 @feedlore/* 都没依赖，所以 /app/node_modules/@feedlore
      #    从来不存在。这里曾写成 test -d /app/node_modules/@feedlore/ai，
      #    从 P10 加到 CI 起每次都失败（连续 12 轮红），却被当成「流程还在调」。
      #    改断言前先跑 docker run 手工验证路径，别看图说话。
      - name: 检查镜像内产物
        run: |
          docker run --rm feedlore:ci sh -c '
            set -e
            test -f /app/apps/web/dist/index.html || { echo "缺少前端产物"; exit 1; }
            test -f /app/apps/web/dist/sw.js || { echo "缺少 PWA service worker"; exit 1; }
            test -f /app/apps/web/dist/manifest.json || { echo "缺少 PWA manifest"; exit 1; }
            ls /app/apps/web/dist/assets/*.js >/dev/null 2>&1 || { echo "缺少带哈希的前端资源"; exit 1; }
            test -f /app/apps/server/src/index.ts || { echo "缺少 server 入口"; exit 1; }
            # 用 -e 而非 -d：跟随符号链接，链接悬空（packages 没拷全）也判失败
            test -e /app/apps/server/node_modules/@feedlore/ai/package.json || { echo "workspace 包 @feedlore/ai 未链接或悬空"; exit 1; }
            test -e /app/apps/server/node_modules/@feedlore/contract/package.json || { echo "workspace 包 @feedlore/contract 未链接或悬空"; exit 1; }
            echo "镜像产物齐全"
          '

      # 预构建镜像会把基础镜像的 digest 冻在推送那一刻：`FROM node:22.23-slim` 的浮动
      # 只作用在构建时，构建缓存或镜像站回退都可能产出未打补丁的 Node 却没人报警。
      # 下限 = 2026-11-11 覆盖 22/24/26 的安全发行（TLS 主机名校验绕过、dns.resolve
      # NUL 截断等，正是服务端 SSRF 防线依赖的行为）。engines / README / Dockerfile /
      # 本工作流用同一个数字，改一处就要四处一起改。
      - name: 校验镜像内 Node 运行时不低于安全下限
        run: |
          docker run --rm -e NODE_FLOOR=22.23.4 feedlore:ci node -e '
            const cmp = (a, b) => {
              const x = a.split(".").map(Number);
              const y = b.split(".").map(Number);
              for (let i = 0; i < 3; i++) {
                if ((x[i] || 0) !== (y[i] || 0)) return (x[i] || 0) < (y[i] || 0) ? -1 : 1;
              }
              return 0;
            };
            const floor = process.env.NODE_FLOOR;
            if (cmp(process.versions.node, floor) < 0) {
              console.error("Node runtime " + process.versions.node + " is below the security floor " + floor);
              process.exit(1);
            }
            console.log("Node runtime " + process.versions.node + " >= floor " + floor);
          '
