name: CI

# 单一主线 main（2.x monorepo：pnpm + turbo），只做检查与本地镜像构建，
# **不推任何 registry**。
#
# ⚠️ 镜像只由 release.yml 在打 tag 时推送：latest 是所有站点 Watchtower 的触发点，
#    在这里推一次就等于把线上换成未发布的代码。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一分支连续 push 时取消旧的一轮：CI 只关心最新提交
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================================================
  # monorepo 全量检查（与 Release 共用 verify.yml，避免两套闸门漂移）
  # ==========================================================================
  check:
    uses: ./.github/workflows/verify.yml

  # ARM64 单独跑一次镜像构建：生产机是 ARM，而 sharp 这类原生依赖
  # 在 x64 上构建成功不代表 arm64 有对应预编译包 —— 那正是「本地好、线上崩」的常见来源。
  # 放在 check 之后（needs 它），避免每次 push 都并行跑两遍完整依赖安装。
  image-arm64:
    needs: check
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: 构建镜像（arm64，不推送）
        run: docker build -f Dockerfile -t feedlore:ci-arm64 .
