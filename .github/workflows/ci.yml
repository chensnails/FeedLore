name: CI

# 两条并行的检查线，按分支分流（决策见 docs/技术栈与重构架构.md 的 P10 一节）：
# - `main`  ：1.7.x 单体（npm），发版镜像由 release.yml 构建并推 ghcr latest；
# - `v2`    ：monorepo（pnpm + turbo），只做检查与本地镜像构建，**不推任何 registry**。
#
# ⚠️ v2 的镜像绝不在这里推 ghcr：latest 是 172.26.1.1 生产站 Watchtower 的唯一触发点，
#    在 v2 分支上推一次就等于把线上换成半成品。
on:
  push:
    branches: [main, v2]
  pull_request:
    branches: [main, v2]

# 同一分支连续 push 时取消旧的一轮：CI 只关心最新提交
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================================================
  # v2：monorepo 全量检查
  # ==========================================================================
  v2-check:
    if: github.ref_name == 'v2' || github.base_ref == 'v2'
    runs-on: ubuntu-24.04 # 必须 pin：ubuntu-latest 曾静默迁到 26.04 导致构建失败
    # 接口级测试要一个真 Postgres。版本钉死到与测试栈/生产同一条线（18.4），
    # 否则「本地/CI 用 16，线上 18」会在 collation、generated column 这类地方悄悄分叉。
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_DB: feedlore_itest
          POSTGRES_USER: feedlore_v2
          POSTGRES_PASSWORD: ci-not-a-secret # 只活在单次 runner 内，容器随 job 销毁
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U feedlore_v2 -d feedlore_itest"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4

      # pnpm 要在 setup-node 之前就位，否则 `cache: pnpm` 找不到 pnpm 可执行文件
      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # 六个包逐个 tsc --noEmit。注意它守不住「契约 path 字面量被拓宽」这类问题
      # （P7 的真坑：服务端全绿、前端 hc 却缺路由），所以真正的守门是下面两步。
      - name: 类型检查
        run: pnpm -r run typecheck

      # 纯函数单测 + 契约自检。守的是 tsc 看不见的那一类：
      # 过滤/解析的边界行为、SSRF 判定（198.18 必须放行）、OPML 往返、
      # 以及「契约 path 被拓宽成 string 导致端点静默不进 AppType」。
      #
      # ⚠️ 这一步刻意**不给 DATABASE_URL**：单元测试必须是自足的。
      #    给了库地址，接口级测试会在这里也跑一遍，而一旦它因为连不上库而失败，
      #    你就分不清「逻辑算错了」还是「环境没起好」。
      - name: 单元测试（不连库）
        run: pnpm -r run test
        env:
          DATABASE_URL: ''

      # 真库 + 真鉴权 + 契约校验。守的是「只有装起来才暴露」的那类：
      # better-auth 的 usePlural / display_username、纯 HTTP 下的 secure Cookie、
      # 带 Cookie 的请求缺 Origin 被 403、cuid 主键与契约 IdSchema 不匹配 …
      - name: 数据库迁移
        run: pnpm --filter @feedlore/db run migrate
        env:
          DATABASE_URL: postgres://feedlore_v2:ci-not-a-secret@127.0.0.1:5432/feedlore_itest

      - name: 接口级集成测试（真库）
        run: pnpm --filter @feedlore/server exec node --import tsx --test src/api.integration.test.ts
        env:
          DATABASE_URL: postgres://feedlore_v2:ci-not-a-secret@127.0.0.1:5432/feedlore_itest

      - name: 构建前端
        run: pnpm --filter @feedlore/web run build

      # 查的是**打包之后**的事实：PWA 文件有没有进产物、资源带不带哈希、
      # 触屏媒体查询有没有被工具链吞掉。单测跑源码，这些它看不到。
      - name: 校验前端产物
        run: node scripts/verify-dist.mjs

      - name: 构建镜像（不推送）
        run: docker build -f Dockerfile -t feedlore-v2:ci .

      # 镜像构建成功但产物没拷对，是「容器起来就 404」的经典原因；
      # 这一步只查最关键的事实：前端产物在、server 入口在、workspace 包链接在。
      #
      # ⚠️ workspace 包链接在**依赖它的那个包**下面，不在根。pnpm 是隔离布局：
      #    根 package.json 一个 @feedlore/* 都没依赖，所以 /app/node_modules/@feedlore
      #    从来不存在。这里曾写成 test -d /app/node_modules/@feedlore/ai，
      #    从 P10 加到 CI 起每次都失败（连续 12 轮红），却被当成「流程还在调」。
      #    改断言前先跑 docker run 手工验证路径，别看图说话。
      - name: 检查镜像内产物
        run: |
          docker run --rm feedlore-v2:ci sh -c '
            set -e
            test -f /app/apps/web/dist/index.html || { echo "缺少前端产物"; exit 1; }
            test -f /app/apps/web/dist/sw.js || { echo "缺少 PWA service worker"; exit 1; }
            test -f /app/apps/web/dist/manifest.json || { echo "缺少 PWA manifest"; exit 1; }
            ls /app/apps/web/dist/assets/*.js >/dev/null 2>&1 || { echo "缺少带哈希的前端资源"; exit 1; }
            test -f /app/apps/server/src/index.ts || { echo "缺少 server 入口"; exit 1; }
            # 用 -e 而非 -d：跟随符号链接，链接悬空（packages 没拷全）也判失败
            test -e /app/apps/server/node_modules/@feedlore/ai/package.json || { echo "workspace 包 @feedlore/ai 未链接或悬空"; exit 1; }
            test -e /app/apps/server/node_modules/@feedlore/contract/package.json || { echo "workspace 包 @feedlore/contract 未链接或悬空"; exit 1; }
            echo "镜像产物齐全"
          '

  # ARM64 单独跑一次镜像构建：生产机是 ARM，而 sharp 这类原生依赖
  # 在 x64 上构建成功不代表 arm64 有对应预编译包 —— 那正是「本地好、线上崩」的常见来源。
  # 放在 check 之后（needs 它），避免每次 push 都并行跑两遍完整依赖安装。
  v2-image-arm64:
    if: github.ref_name == 'v2' || github.base_ref == 'v2'
    needs: v2-check
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: 构建镜像（arm64，不推送）
        run: docker build -f Dockerfile -t feedlore-v2:ci-arm64 .

  # ==========================================================================
  # legacy（1.7.x 单体，main 分支）—— 保持原样，不在本轮重构范围内
  # ==========================================================================
  legacy:
    if: github.ref_name == 'main' || github.base_ref == 'main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建前端
        run: npm run build

      - name: UI 回归测试
        run: npm run test:ui

      # 含三项静态校验：① Dockerfile 有没有漏拷 lib/（镜像构建成功但容器启动即崩）
      # ② 抽走的顶层标识符有没有留下裸引用（v2.2.1 的 imgCache 教训）
      # ③ deploy.sh 的启动期错误日志扫描护栏还在不在（v2.2.2）
      - name: 后端单测 + 静态校验
        run: npm run test:server

      - name: 冒烟：Node 端可加载
        run: node --check server.js
