name: Release

# tag 发布：构建双架构镜像推 ghcr.io，并自动创建 GitHub Release。
# 发版 = git tag -a vX.Y.Z && git push origin --tags；本站（Watchtower 模式）
# 会在几分钟内自动拉到新镜像并重启容器，关于页也可一键触发。
#
# 发布闸门（v1.3.11 起）：tag 推上来不等于对外发布。gate job 按 tag 分三档：
#   ① 正式版 vX.Y.Z        → 构建镜像，推版本号标签 + latest，并建 GitHub Release
#   ② 预发布 vX.Y.Z-xxx    → 构建镜像，**只推版本号标签**；latest 不动、不建 Release
#   ③ 其它（分支名等）     → 不构建
# 任何一档都要求 tag 与 VERSION、package.json 的 version 三者一致。
# 分档的意义：预发布镜像是给自己或少数人试的，而 latest 一被覆盖，
# 所有 Watchtower 用户几分钟内就会被动升级 —— 那才是真正的"发布"。
#
# 性能（v1.2.0 起）：amd64 与 arm64 各用一个「原生架构」runner 平行构建，不再用
# QEMU 模拟。此前单 job + QEMU 的方式，arm64 冷构建（层缓存失效时）实测 40 分钟仍未结束；
# 拆成两个原生 runner 后，两个架构各自原生编译，实测各 35~40 秒完成。
# 两个 build job 各自 push-by-digest，最后由 merge job 合并 manifest 清单。
#
# 镜像标签约定：版本号去掉 v（1.2.0），另打 latest。

on:
  push:
    tags: ['v*']

permissions:
  contents: write      # 建 Release
  packages: write      # 推 ghcr

env:
  REGISTRY_IMAGE: ghcr.io/chensnails/feedlore

jobs:
  # 发布闸门：先判「该不该发布」，再决定要不要花两个 runner 去构建。
  # 注意 on.push.tags 仍是 v*（filter 通配符不支持正则），形态校验放在这里做，
  # 这样被拦下的 tag 会留下一条 notice 说明原因，而不是让 workflow 静默不触发。
  gate:
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.check.outputs.build }}
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - uses: actions/checkout@v4

      - name: 校验 tag 形态与版本号一致性
        id: check
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          # 默认两样都不给：任何一步没走到最后，既不构建也不发布
          echo "build=false" >> "$GITHUB_OUTPUT"
          echo "publish=false" >> "$GITHUB_OUTPUT"

          # 1) 只认版本 tag：正式版 vX.Y.Z 或预发布 vX.Y.Z-后缀。
          #    filter 通配符不支持正则，形态校验只能放在这里 —— 好处是被拦下的
          #    tag 会留下一条 notice 说明原因，而不是让 workflow 静默不触发。
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "::notice title=跳过构建::tag「$TAG」不是版本 tag（需 vX.Y.Z 或 vX.Y.Z-后缀）"
            exit 0
          fi

          # 2) tag 必须与仓库里的版本号一致。镜像内的 pkg.version 就是「关于 → 检查更新」
          #    用来比大小的基准，对不上会让用户侧永远差一版（要么一直提示更新，要么永远看不到）。
          WANT="${TAG#v}"
          FILE_VERSION="$(tr -d '[:space:]' < VERSION)"
          PKG_VERSION="$(node -p 'require("./package.json").version')"
          if [[ "$WANT" != "$FILE_VERSION" || "$WANT" != "$PKG_VERSION" ]]; then
            echo "::error title=版本号不一致::tag=v$WANT / VERSION=$FILE_VERSION / package.json=$PKG_VERSION —— 先改版本号并提交，再打 tag"
            exit 1
          fi

          # 到这里就值得构建镜像了
          echo "build=true" >> "$GITHUB_OUTPUT"

          # 3) 带 -后缀 的是预发布：镜像照建，但只推版本号标签。
          #    不碰 latest（Watchtower 盯的就是它）、不建 Release（关于页看的是它）。
          if [[ "$WANT" == *-* ]]; then
            echo "::notice title=预发布：只推版本号标签::ghcr:$WANT 将可用，latest 保持不变、不建 Release"
            exit 0
          fi

          # 4) 正式版：latest 指向它，并建 Release
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "::notice title=正式发布::v$WANT —— latest 将指向该镜像，并创建 GitHub Release"

  build:
    needs: gate
    if: needs.gate.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送（${{ matrix.platform }}，按 digest）
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # digest 输出是一段字符串（如 sha256:abc...），不是文件路径，
      # 所以必须先落成文件再上传，否则 upload-artifact 会报「No files were found」。
      - name: 导出 digest 到文件
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          echo "${{ steps.build.outputs.digest }}" > "${{ runner.temp }}/digests/digest-${{ strategy.job-index }}.txt"

      - name: 上传 digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ strategy.job-index }}
          path: ${{ runner.temp }}/digests/digest-${{ strategy.job-index }}.txt
          retention-days: 1
          if-no-files-found: error

  merge:
    needs: [gate, build]
    if: needs.gate.outputs.build == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: 下载各架构 digest
        uses: actions/download-artifact@v4
        with:
          path: digests
          pattern: digest-*
          merge-multiple: true

      - name: 登录 ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 合并 manifest（版本号标签 + 正式版才加 latest）
        id: merge
        working-directory: digests
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          PUBLISH="${{ needs.gate.outputs.publish }}"
          refs=""
          for f in digest-*.txt; do
            refs="$refs ${{ env.REGISTRY_IMAGE }}@$(tr -d '[:space:]' < "$f")"
          done
          echo "merging:$refs"

          # 版本号标签一律打。latest 只给正式版：它是 Watchtower 唯一的触发点，
          # 预发布一旦把 latest 挪过去，所有已部署实例几分钟内就会被升级。
          TAGS=(--tag "${{ env.REGISTRY_IMAGE }}:$VERSION")
          if [[ "$PUBLISH" == "true" ]]; then
            TAGS+=(--tag "${{ env.REGISTRY_IMAGE }}:latest")
          fi
          docker buildx imagetools create $refs "${TAGS[@]}"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$PUBLISH" != "true" ]]; then
            echo "::notice title=预发布镜像已就绪::ghcr.io/chensnails/feedlore:$VERSION（latest 未改动、未建 Release）"
          fi

      - name: 创建 GitHub Release（仅正式版）
        if: needs.gate.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # merge job 没有 checkout，gh 无法从 git remote 推断仓库，必须显式指定
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          NOTES=$(cat <<'EOT'
          镜像：`ghcr.io/chensnails/feedlore:${{ steps.merge.outputs.version }}`（amd64 + arm64）

          Watchtower 模式（docker-compose.release.yml）下，宿主机几分钟内自动拉取重启；
          关于页「一键更新」可立即触发。详见 [CHANGELOG.md](https://github.com/chensnails/FeedLore/blob/main/CHANGELOG.md)。
          EOT
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，更新说明"
            gh release edit "$TAG" --title "$TAG" --notes "$NOTES"
          else
            gh release create "$TAG" --title "$TAG" --notes "$NOTES"
          fi
