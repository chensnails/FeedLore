name: Release

# 2.x 发布：构建双架构镜像推 ghcr.io/chensnails/feedlore-v2，并自动创建 GitHub Release。
# 发版 = git tag -a vX.Y.Z && git push origin --tags。
#
# 与 1.x 的发布**互不干扰**：1.x 镜像仍是 ghcr.io/chensnails/feedlore（由 main 分支上
# 的同名工作流负责），1.x 用户的 Watchtower 盯的是 feedlore:latest —— 这里推任何标签
# 都不会把 1.x 站点升上来。合并 v2 → main 时这份文件会覆盖 main 上的同名文件，
# 届时「feedlore-v2 继续并存还是改回 feedlore」是那一次切换要一起决定的事。
#
# 发布闸门（沿用 1.3.11 起的规则）：tag 推上来不等于对外发布。gate job 按 tag 分三档：
#   ① 正式版 vX.Y.Z        → 构建镜像，推版本号标签 + latest，并建 GitHub Release
#   ② 预发布 vX.Y.Z-xxx    → 构建镜像，**只推版本号标签**；latest 不动、不建 Release
#   ③ 其它（分支名等）     → 不构建
# 两种可构建的档位都要求 tag 与 package.json 的 version 一致。v2 的版本号**单一真源就是
# package.json**（镜像内 APP_VERSION 也读它），不再维护 1.x 的 VERSION 文件。
# 分档的意义：预发布镜像是给自己或少数人试的，而 latest 一被覆盖，
# 所有跟着 latest 的部署下次重建容器时就会被动换版本 —— 那才是真正的"发布"。
#
# 性能：amd64 与 arm64 各用一个「原生架构」runner 平行构建，不跑 QEMU 模拟；
# 两个 build job 各自 push-by-digest，最后由 merge job 合并 manifest 清单。
#
# 镜像标签约定：版本号去掉 v（2.0.0），另打 latest（仅正式版）。

on:
  push:
    tags: ['v*']

permissions:
  contents: write      # 建 Release
  packages: write      # 推 ghcr

env:
  REGISTRY_IMAGE: ghcr.io/chensnails/feedlore-v2

jobs:
  # 发布闸门：先判「该不该发布」，再决定要不要花两个 runner 去构建。
  # 注意 on.push.tags 仍是 v*（filter 通配符不支持正则），形态校验放在这里做，
  # 这样被拦下的 tag 会留下一条 notice 说明原因，而不是让 workflow 静默不触发。
  gate:
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.check.outputs.build }}
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - uses: actions/checkout@v4

      - name: 校验 tag 形态与版本号一致性
        id: check
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          # 默认两样都不给：任何一步没走到最后，既不构建也不发布
          echo "build=false" >> "$GITHUB_OUTPUT"
          echo "publish=false" >> "$GITHUB_OUTPUT"

          # 1) 只认版本 tag：正式版 vX.Y.Z 或预发布 vX.Y.Z-后缀。
          #    filter 通配符不支持正则，形态校验只能放在这里 —— 好处是被拦下的
          #    tag 会留下一条 notice 说明原因，而不是让 workflow 静默不触发。
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "::notice title=跳过构建::tag「$TAG」不是版本 tag（需 vX.Y.Z 或 vX.Y.Z-后缀）"
            exit 0
          fi

          WANT="${TAG#v}"

          # 2) 这份工作流只发布 2.x。1.x 的补丁仍由 main 分支发布到 feedlore 镜像；
          #    万一在 v2 分支的提交上误打了 v1.x tag，这里直接拦下，避免 1.x 的代码
          #    被当成 2.0 推成 feedlore-v2 —— 那种镜像下载下去是没法用的。
          MAJOR="${WANT%%.*}"
          if (( 10#$MAJOR < 2 )); then
            echo "::error title=版本号不属于 2.x::tag=v$WANT 会被推到 feedlore-v2 —— 1.x 请在 main 分支打 tag"
            exit 1
          fi

          # 3) tag 必须与 package.json 的 version 一致。镜像内的 pkg.version 就是
          #    「关于 → 检查更新」用来比大小的基准，对不上会让用户侧永远差一版
          #    （要么一直提示更新，要么永远看不到新版本）。
          PKG_VERSION="$(node -p 'require("./package.json").version')"
          if [[ "$WANT" != "$PKG_VERSION" ]]; then
            echo "::error title=版本号不一致::tag=v$WANT / package.json=$PKG_VERSION —— 先改版本号并提交，再打 tag"
            exit 1
          fi

          # 到这里就值得构建镜像了
          echo "build=true" >> "$GITHUB_OUTPUT"

          # 4) 带 -后缀 的是预发布：镜像照建，但只推版本号标签。
          #    不碰 latest（那是"正式发布"的唯一标记）、不建 Release。
          if [[ "$WANT" == *-* ]]; then
            echo "::notice title=预发布：只推版本号标签::ghcr.io/chensnails/feedlore-v2:$WANT 将可用，latest 保持不变、不建 Release"
            exit 0
          fi

          # 5) 正式版：latest 指向它，并建 Release
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "::notice title=正式发布::v$WANT —— feedlore-v2:latest 将指向该镜像，并创建 GitHub Release"

  build:
    needs: gate
    if: needs.gate.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送（${{ matrix.platform }}，按 digest）
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # digest 输出是一段字符串（如 sha256:abc...），不是文件路径，
      # 所以必须先落成文件再上传，否则 upload-artifact 会报「No files were found」。
      - name: 导出 digest 到文件
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          echo "${{ steps.build.outputs.digest }}" > "${{ runner.temp }}/digests/digest-${{ strategy.job-index }}.txt"

      - name: 上传 digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ strategy.job-index }}
          path: ${{ runner.temp }}/digests/digest-${{ strategy.job-index }}.txt
          retention-days: 1
          if-no-files-found: error

  merge:
    needs: [gate, build]
    if: needs.gate.outputs.build == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: 下载各架构 digest
        uses: actions/download-artifact@v4
        with:
          path: digests
          pattern: digest-*
          merge-multiple: true

      - name: 登录 ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 合并 manifest（版本号标签 + 正式版才加 latest）
        id: merge
        working-directory: digests
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          PUBLISH="${{ needs.gate.outputs.publish }}"
          refs=""
          for f in digest-*.txt; do
            refs="$refs ${{ env.REGISTRY_IMAGE }}@$(tr -d '[:space:]' < "$f")"
          done
          echo "merging:$refs"

          # 版本号标签一律打。latest 只给正式版：预发布一旦把 latest 挪过去，
          # 跟着 latest 的部署下次重建容器时就会拿到未经验证的版本。
          TAGS=(--tag "${{ env.REGISTRY_IMAGE }}:$VERSION")
          if [[ "$PUBLISH" == "true" ]]; then
            TAGS+=(--tag "${{ env.REGISTRY_IMAGE }}:latest")
          fi
          docker buildx imagetools create $refs "${TAGS[@]}"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$PUBLISH" != "true" ]]; then
            echo "::notice title=预发布镜像已就绪::ghcr.io/chensnails/feedlore-v2:$VERSION（latest 未改动、未建 Release）"
          fi

      - name: 创建 GitHub Release（仅正式版）
        if: needs.gate.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # merge job 没有 checkout，gh 无法从 git remote 推断仓库，必须显式指定
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          NOTES=$(cat <<'EOT'
          镜像：`ghcr.io/chensnails/feedlore-v2:${{ steps.merge.outputs.version }}`（amd64 + arm64）

          从 1.x 升级：按 [UPGRADE-v2.md](https://github.com/chensnails/FeedLore/blob/${{ github.ref_name }}/UPGRADE-v2.md)
          备份 → 在 `.env` 补 `AUTH_SECRET` / `AUTH_BASE_URL` →
          `docker compose -f docker-compose.v2.release.yml up -d`。
          2.x 镜像不打 Watchtower 标签，不会被自动升级；换版本请显式改 `V2_IMAGE` 后 `up -d`。
          EOT
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，更新说明"
            gh release edit "$TAG" --title "$TAG" --notes "$NOTES"
          else
            gh release create "$TAG" --title "$TAG" --notes "$NOTES"
          fi
