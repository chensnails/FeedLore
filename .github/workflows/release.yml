name: Release

# 2.x 发布：构建双架构镜像推 ghcr.io/chensnails/feedlore，并自动创建 GitHub Release。
# 发版 = git tag -a vX.Y.Z && git push origin --tags。
#
# 镜像通道：2.x **占用 ghcr.io/chensnails/feedlore**（1.x 用的同一个仓库）。
# 这是「1.x 用户无感升级」的关键：1.x 容器的 watchtower 盯的是 feedlore:latest，
# 正式版把 latest 移过来，watchtower 拉到的就是 v2 镜像；v2 进程启动时自举
# （建 feedlore_v2、迁移数据、改成 UTC），用户不用改任何配置（见 UPGRADE-v2.md）。
# 因此 **feedlore-v2 这个通道已退役**，不要再往里推东西。
#
# main 是唯一主线（2.x monorepo），1.x 已冻结在 v1.7.4（只存在于 tag，不再从本仓库发布）。
# 因此 v1.x tag 会被 gate 直接拒绝：latest 归 2.x，发 1.x = 把存量用户降级。
#
# 发布闸门（沿用 1.3.11 起的规则）：tag 推上来不等于对外发布。gate job 按 tag 分三档：
#   ① 正式版 vX.Y.Z        → 构建镜像，推版本号标签 + latest，并建 GitHub Release
#   ② 预发布 vX.Y.Z-xxx    → 构建镜像，**只推版本号标签**（不碰 latest，不影响存量用户）
#   ③ 其它（分支名等）     → 不构建
# 两种可构建的档位都要求 tag 与 package.json 的 version 一致。版本号**单一真源就是
# package.json**（镜像内 APP_VERSION 也读它）。
# 分档的意义：预发布镜像是给自己或少数人试的，不动 latest、不建 Release 就不算对外发布。
#
# 性能：amd64 与 arm64 各用一个「原生架构」runner 平行构建，不跑 QEMU 模拟；
# 两个 build job 各自 push-by-digest，最后由 merge job 合并 manifest 清单。
#
# 镜像标签约定：**formal = 版本号 + latest，prerelease = 只有版本号**。
# latest 是滚动通道（watchtower 自动升级 + 设置页「一键更新」都跟它走）；
# 想要钉死版本的用户把 compose 里的 image 写成 feedlore:<版本号> 即可。

on:
  push:
    tags: ['v*']

permissions:
  contents: write      # 建 Release
  packages: write      # 推 ghcr

env:
  REGISTRY_IMAGE: ghcr.io/chensnails/feedlore

jobs:
  # 发布闸门：先判「该不该发布」，再决定要不要花两个 runner 去构建。
  # 注意 on.push.tags 仍是 v*（filter 通配符不支持正则），形态校验放在这里做，
  # 这样被拦下的 tag 会留下一条 notice 说明原因，而不是让 workflow 静默不触发。
  gate:
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.check.outputs.build }}
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - uses: actions/checkout@v4

      - name: 校验 tag 形态与版本号一致性
        id: check
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          # 默认两样都不给：任何一步没走到最后，既不构建也不发布
          echo "build=false" >> "$GITHUB_OUTPUT"
          echo "publish=false" >> "$GITHUB_OUTPUT"

          # 1) 只认版本 tag：正式版 vX.Y.Z 或预发布 vX.Y.Z-后缀。
          #    filter 通配符不支持正则，形态校验只能放在这里 —— 好处是被拦下的
          #    tag 会留下一条 notice 说明原因，而不是让 workflow 静默不触发。
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "::notice title=跳过构建::tag「$TAG」不是版本 tag（需 vX.Y.Z 或 vX.Y.Z-后缀）"
            exit 0
          fi

          WANT="${TAG#v}"

          # 2) 这份工作流只发布 2.x。1.x 已冻结（只存在于 v1.7.4 tag），
          #    万一误打了 v1.x tag，这里直接拦下，避免旧代码被推成 feedlore:latest ——
          #    那会直接把存量用户「升级」成旧版本。
          MAJOR="${WANT%%.*}"
          if (( 10#$MAJOR < 2 )); then
            echo "::error title=版本号不属于 2.x::tag=v$WANT 会被推到 feedlore 镜像 —— 1.x 已冻结，不再发布"
            exit 1
          fi

          # 3) tag 必须与 package.json 的 version 一致。镜像内的 pkg.version 就是
          #    「关于 → 检查更新」用来比大小的基准，对不上会让用户侧永远差一版
          #    （要么一直提示更新，要么永远看不到新版本）。
          PKG_VERSION="$(node -p 'require("./package.json").version')"
          if [[ "$WANT" != "$PKG_VERSION" ]]; then
            echo "::error title=版本号不一致::tag=v$WANT / package.json=$PKG_VERSION —— 先改版本号并提交，再打 tag"
            exit 1
          fi

          # 到这里就值得构建镜像了
          echo "build=true" >> "$GITHUB_OUTPUT"

          # 4) 带 -后缀 的是预发布：镜像照建，只推版本号标签、不碰 latest、不建 Release。
          if [[ "$WANT" == *-* ]]; then
            echo "::notice title=预发布：只推版本号标签::ghcr.io/chensnails/feedlore:$WANT 将可用，latest 不动"
            exit 0
          fi

          # 5) 正式版：建 Release，并把 latest 移到这一版
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "::notice title=正式发布::v$WANT —— feedlore:$WANT 将发布、latest 跟随，并创建 GitHub Release"

  build:
    needs: gate
    if: needs.gate.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送（${{ matrix.platform }}，按 digest）
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # digest 输出是一段字符串（如 sha256:abc...），不是文件路径，
      # 所以必须先落成文件再上传，否则 upload-artifact 会报「No files were found」。
      - name: 导出 digest 到文件
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          echo "${{ steps.build.outputs.digest }}" > "${{ runner.temp }}/digests/digest-${{ strategy.job-index }}.txt"

      - name: 上传 digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ strategy.job-index }}
          path: ${{ runner.temp }}/digests/digest-${{ strategy.job-index }}.txt
          retention-days: 1
          if-no-files-found: error

  merge:
    needs: [gate, build]
    if: needs.gate.outputs.build == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: 下载各架构 digest
        uses: actions/download-artifact@v4
        with:
          path: digests
          pattern: digest-*
          merge-multiple: true

      - name: 登录 ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 合并 manifest（仅版本号标签）
        id: merge
        working-directory: digests
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          PUBLISH="${{ needs.gate.outputs.publish }}"
          refs=""
          for f in digest-*.txt; do
            refs="$refs ${{ env.REGISTRY_IMAGE }}@$(tr -d '[:space:]' < "$f")"
          done
          echo "merging:$refs"

          # 版本号标签人人都有；latest 只给正式版。
          # latest 是滚动通道：1.x 用户容器里的 watchtower 盯的就是它，把 latest
          # 移过来 = 存量站点自动升级到 v2，无需改任何配置。
          docker buildx imagetools create $refs --tag "${{ env.REGISTRY_IMAGE }}:$VERSION"
          if [[ "$PUBLISH" == "true" ]]; then
            docker buildx imagetools create $refs --tag "${{ env.REGISTRY_IMAGE }}:latest"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$PUBLISH" != "true" ]]; then
            echo "::notice title=预发布镜像已就绪::ghcr.io/chensnails/feedlore:$VERSION（latest 未动，未建 Release）"
          fi

      - name: 创建 GitHub Release（仅正式版）
        if: needs.gate.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # merge job 没有 checkout，gh 无法从 git remote 推断仓库，必须显式指定
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          NOTES=$(cat <<'EOT'
          镜像：`ghcr.io/chensnails/feedlore:${{ steps.merge.outputs.version }}`（amd64 + arm64），`latest` 已指向这一版。

          ## 从 1.x 升级（无感）

          已经装了 Watchtower 的 1.x 站点**什么都不用做**：Watchtower 会拉取 `feedlore:latest`
          并重建容器，v2 进程在启动时自动完成建库、结构迁移、数据迁移与校验
          （源库只读，另留一份 `<库名>_backup` 快照）。首次启动要多等几分钟，日志里看到
          `自举完成` 即可。原账号密码直接可登录。

          ## 手动 / 全新部署

          见 [UPGRADE-v2.md](https://github.com/chensnails/FeedLore/blob/${{ github.ref_name }}/UPGRADE-v2.md)。
          `AUTH_SECRET`、`AUTH_BASE_URL` 都可以不填（自动生成并持久化 / 按访问域名同源校验）。

          ## 之后怎么更新

          `latest` 是滚动通道：Watchtower 自动升级照旧；也可以在「设置 → 关于」里点「一键更新」。
          想钉死版本就把 compose 里的 image 写成 `feedlore:<版本号>`。
          EOT
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，更新说明"
            gh release edit "$TAG" --title "$TAG" --notes "$NOTES"
          else
            gh release create "$TAG" --title "$TAG" --notes "$NOTES"
          fi
