# 笺川（FeedLore）· 发布态 Compose（镜像模式 + Watchtower 自动更新）
#
# 与本目录的 docker-compose.yml（源码构建模式）二选一：
# - docker-compose.yml          ：本地有源码，docker compose up -d --build 现场构建
# - docker-compose.release.yml  ：拉取 ghcr.io 预构建镜像，Watchtower 自动更新
#
# 用法：
#   1. cp .env.example .env 并填好 PG_PASSWORD / WATCHTOWER_HTTP_API_TOKEN
#      （源码模式已有的 .env 可直接复用，只需补 WATCHTOWER_HTTP_API_TOKEN）
#   2. LINUX:  docker compose -f docker-compose.release.yml up -d
#      WIN:    docker compose -f docker-compose.release.yml --env-file .env up -d
#   3. 之后发版 = push 正式版 tag（vX.Y.Z）；Watchtower 每 5 分钟检查一次，
#      或在「设置 → 关于」点「一键更新」立即触发。
#      CI 按 tag 分档：正式版 vX.Y.Z 才会重建 latest（所有部署跟着更新）；
#      预发布 vX.Y.Z-testN 只产出 ghcr 上的同名标签，latest 不动；
#      只推 main 分支不推 tag，已部署的实例不会被更新。
#
# 项目名 / 容器 / 卷 / 网络沿用 feedlore 前缀，与源码模式完全一致：
# 从源码模式切换过来时，数据库卷（feedlore-pgdata）原样复用，数据零迁移。
name: feedlore

services:
  # ---------------------------------------------------------------
  # 专用 PostgreSQL：只为笺川服务，数据卷独立，不对外映射端口
  # ---------------------------------------------------------------
  db:
    # 与宿主机已有 postgres 容器同版本，可复用本地镜像；需要升级时改这里再 up -d
    image: postgres:18.4-alpine
    container_name: feedlore-db
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      POSTGRES_DB: ${PG_DB:-feedlore}
      POSTGRES_USER: ${PG_USER:-feedlore}
      POSTGRES_PASSWORD: ${PG_PASSWORD:?请先在 .env 中设置 PG_PASSWORD}
      # 放进子目录，避免和镜像自带的 lost+found 之类冲突
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - feedlore
    # 刻意不写 ports：数据库只允许应用容器经内网访问
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------
  # 应用：拉取 ghcr.io 预构建镜像（CI 在 tag 推送时构建双架构）
  # ---------------------------------------------------------------
  app:
    image: ghcr.io/chensnails/feedlore:latest
    container_name: feedlore
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      PORT: "3000"
      DATABASE_URL: postgres://${PG_USER:-feedlore}:${PG_PASSWORD}@db:5432/${PG_DB:-feedlore}

      # 一键更新：app 容器只与同网络的 watchtower 通信，不碰宿主机。
      # 按钮（设置 → 关于）POST /api/update 即转发到这里触发立即检查。
      UPDATE_WEBHOOK_URL: ${UPDATE_WEBHOOK_URL:-http://watchtower:8080/v1/update}
      UPDATE_WEBHOOK_TOKEN: ${WATCHTOWER_HTTP_API_TOKEN:?发布态需要 WATCHTOWER_HTTP_API_TOKEN}

      # 首次部署时播种的 RSS 地址（逗号分隔）；仅当订阅表为空时生效。留空则启动后手动添加
      SEED_FEEDS: "${SEED_FEEDS:-}"

      # ---- RSS 抓取（仅首次生成配置时生效，之后以页面设置为准）----
      REFRESH_MINUTES: ${REFRESH_MINUTES:-30}
      KEEP_PER_FEED: ${KEEP_PER_FEED:-300}
      # 条目最长保留天数（0 = 不限，只按条数）
      KEEP_DAYS: ${KEEP_DAYS:-0}
      # 网页自动刷新间隔（分钟，0 = 关闭）
      AUTO_REFRESH_MINUTES: ${AUTO_REFRESH_MINUTES:-0}

      # ---- 大模型 / 每日摘要 ----
      # 没有环境变量：v1.4.0 起完全跟随账号，各人在「设置 → 模型 / 日报」里填，Key 落库前加密


      # ---- 出网安全（v1.7.2-test2）----
      # 默认禁止服务器访问内网 / 回环地址：订阅、Webhook、模型 BaseURL 都会做出网校验。
      # 自建内网源（FreshRSS）或本机 Ollama / vLLM 需要设为 1。
      ALLOW_PRIVATE_HOSTS: "${ALLOW_PRIVATE_HOSTS:-}"
      # 登录限流按「真实 IP + 用户名」；留空 = 自动判断是否信任 X-Forwarded-For
      TRUST_PROXY: "${TRUST_PROXY:-}"

      # ---- 初始账号（仅首次生成配置时生效）----
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASS: ${ADMIN_PASS:-admin}

    # Watchtower 只更新打了这个标签的容器（WATCHTOWER_LABEL_ENABLE=true）
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

    ports:
      - "${HOST_PORT:-3210}:3000"

    networks:
      - feedlore

    # 让容器能通过 host.docker.internal 访问宿主机上已发布的服务
    extra_hosts:
      - "host.docker.internal:host-gateway"

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------
  # Watchtower：监视 app 容器镜像，发现新版本即拉取并重启
  # HTTP API 只听内网 8080，供「一键更新」触发；不经反代对外
  # ---------------------------------------------------------------
  watchtower:
    image: containrrr/watchtower:1.7.1   # containrrr 已归档，固定末版；新版环境变量名不同，勿随意 latest
    # 宿主机上常已有别的服务在用名为 watchtower 的容器，撞名会让本次 up 直接失败。
    # 只改 container_name：app 侧的 UPDATE_WEBHOOK_URL 走的是 compose 服务名 DNS
    # （仍叫 watchtower），改名不影响「一键更新」的转发。
    container_name: feedlore-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      TZ: Asia/Shanghai
      # 只更新显式打标签的容器（app 上面那个 label）
      WATCHTOWER_LABEL_ENABLE: "true"
      # 宿主机 Docker Engine ≥ 29（daemon MinAPIVersion 1.40）会拒绝旧 client 的
      # 版本协商（报 client version 1.25 too old），镜像内 SDK 协商结果不稳定 →
      # 固定客户端 API 版本。宿主机 `docker version` 看 Server.APIVersion，
      # 取 ≤ 它且 ≥ 1.40 的值；daemon 较老（<1.40）时删掉这一行
      DOCKER_API_VERSION: "1.44"
      # 轮询间隔（秒）；页面一键更新是立即触发，不等这个间隔
      WATCHTOWER_POLL_INTERVAL: "300"
      # 清理旧镜像，避免磁盘被历史版本占满
      WATCHTOWER_CLEANUP: "true"
      # HTTP API（containrrr 1.7.x 变量名）：POST /v1/update 立即检查
      # （Authorization: Bearer <token>），供「一键更新」触发
      WATCHTOWER_HTTP_API_UPDATE: "true"
      # 开了 HTTP API 默认只按需不轮询 → 显式保留周期检查（与上方 POLL_INTERVAL 配合）
      WATCHTOWER_HTTP_API_PERIODIC_POLLS: "true"
      WATCHTOWER_HTTP_API_TOKEN: ${WATCHTOWER_HTTP_API_TOKEN:?发布态需要 WATCHTOWER_HTTP_API_TOKEN}
    # 刻意不写 ports：8080 只在 compose 内网可达
    networks:
      - feedlore
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  # 显式命名，否则会被拼成 feedlore_feedlore
  feedlore:
    name: feedlore
    driver: bridge

volumes:
  pgdata:
    name: feedlore-pgdata
