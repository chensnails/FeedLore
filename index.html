<script>
/* 外观偏好：主题模式 + 主色调 + 字号 + 阅读字体 / 行高 / 阅读宽度。
   必须在样式表之前把这些属性写到 <html> 上，否则首屏会先按默认值画一遍再跳一下。
   取值合法性也在这里兜一层：localStorage 是用户可改的，脏值不该让页面崩掉。 */
(function () {
  var el = document.documentElement;
  // 优先用服务端按账号注入的外观（window.__APPEARANCE__）；登录页等无注入时回退本机旧值，再回退默认
  var sa = window.__APPEARANCE__ || null;
  var lsGet = function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } };
  var pick = function (v, list, dflt) { return list.indexOf(v) >= 0 ? v : dflt; };
  var ACCENTS = ['blue', 'violet', 'teal', 'green', 'amber', 'rose'];

  var mode = 'auto';
  if (sa && typeof sa.theme === 'string') mode = sa.theme;
  else { var lm = lsGet('feedlore.theme.v1'); if (lm) mode = lm; }
  if (['auto', 'light', 'dark', 'github'].indexOf(mode) < 0) mode = 'auto';
  el.setAttribute('data-theme-mode', mode);
  // github 是整包主题，不进「跟随系统」；data-theme 直接写 github 走另一套 CSS 变量块
  var mq = window.matchMedia('(prefers-color-scheme: dark)');
  var dark = mode === 'dark' || (mode === 'auto' && mq.matches);
  el.setAttribute('data-theme', mode === 'github' ? 'github' : (dark ? 'dark' : 'light'));

  // 主色调：github 主题写死 GitHub 蓝；其余用账号保存的值（无则用本机旧值）
  var accent = (sa && typeof sa.accent === 'string') ? sa.accent : (lsGet('feedlore.appearance.accent.v1') || 'blue');
  el.setAttribute('data-accent', mode === 'github' ? 'github' : pick(accent, ACCENTS, 'blue'));

  var ap = sa || {};
  el.setAttribute('data-font-size', pick(ap.fontSize, ['s', 'm', 'l'], 'm'));
  el.setAttribute('data-reader-font', pick(ap.readerFont, ['sans', 'serif'], 'sans'));
  el.setAttribute('data-reader-lh', pick(ap.readerLh, ['s', 'm', 'l'], 'm'));
  el.setAttribute('data-reader-fs', pick(ap.readerFs, ['s', 'm', 'l'], 'm'));
  el.setAttribute('data-reader-width', pick(ap.readerWidth, ['s', 'm', 'l', 'full'], 'm'));
})();
</script>

<!-- 顶栏（App Shell）：品牌 / 视图导航 / 条资源 / 刷新 / 添加到手机 / 主题 / 设置。
     P4a 起 React 化，组件见 src/shell/TopBar.jsx，挂载到下面的 #topbarRoot。
     注意 #topbarRoot 就是 <header class="topbar"> 本身（sticky），组件只渲染其内部内容。 -->
<header class="topbar" id="topbarRoot"></header>

<!-- 卡片：默认隐藏，由 switchView 决定显示哪个页面（默认是「文章」）。内容已 React 化，组件见 src/views/CardsView.jsx，挂载到下面的 #cardsRoot -->
<div id="cardsView" hidden><div id="cardsRoot"></div></div>

<!-- 文章：左频道 / 右文章，点标题展开全文（已 React 化，组件见 src/views/ReaderView.jsx，挂载到 #readerRoot） -->
<div class="wrap reader" id="readerView"><div id="readerRoot"></div></div>

<!-- AI：大模型能力聚合页（已 React 化，组件见 src/ai/AiView.jsx，挂载到下面的 #aiRoot） -->
<div class="wrap" id="aiView" hidden><div id="aiRoot"></div></div>

<!-- 设置弹层（已 React 化，组件见 src/settings/SettingsModal.jsx），挂载到 #settingsRoot -->
<div id="settingsRoot"></div>

<!-- 覆盖层：toast / 「N 条新内容」浮标 / 图片灯箱（已 React 化，组件见 src/ui/Overlays.jsx） -->
<div id="overlaysRoot"></div>

<!-- 命令面板 ⌘K / Ctrl+K（现代化快捷键交互，参考 Linear / Vercel 命令面板）。
     已 React 化：组件见 src/cmdk/CommandPalette.jsx，由 main.jsx 挂载到下面的节点 -->
<div id="cmdkRoot"></div>
