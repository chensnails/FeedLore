<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<!-- 与登录页同一套文档骨架：样式表到达前按系统深浅兜底画布，主题仍由内联脚本决定。 -->
<meta name="color-scheme" content="light dark">
<title>设置新密码 · 笺川</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#242424" media="(prefers-color-scheme: dark)">
<script>
/* 主题与界面字号：与主站 / 登录页共用同一份本机外观偏好 feedlore.appearance.v2。
   逻辑与 login.html 的首屏脚本逐字同源 —— 两个页面必须保持一致的观感，
   任何一边改主题键名都要同步改另一边。 */
(() => {
  var KEY = 'feedlore.appearance.v2';
  var MODES = ['auto', 'light', 'dark', 'github'];
  var ap = {};
  try { ap = JSON.parse(localStorage.getItem(KEY) || 'null') || {}; } catch (e) { /* 隐私模式 / 坏 JSON */ }
  var mode = MODES.indexOf(ap && ap.theme) >= 0 ? ap.theme : 'auto';
  var mq = window.matchMedia('(prefers-color-scheme: dark)');
  var eff = mode === 'auto' ? (mq.matches ? 'dark' : 'light') : mode;
  var el = document.documentElement;
  el.setAttribute('data-theme', eff);
  el.setAttribute('data-theme-mode', mode);
  var fontSize = ['s', 'm', 'l'].indexOf(ap && ap.fontSize) >= 0 ? ap.fontSize : 'm';
  el.setAttribute('data-font-size', fontSize);

  var THEME_COLORS = { light: '#f4f5f7', dark: '#242424', github: '#0d1117' };
  var tcs = document.querySelectorAll('meta[name="theme-color"]');
  var tcColor = THEME_COLORS[eff] || '#f4f5f7';
  for (var ti = 0; ti < tcs.length; ti++) tcs[ti].setAttribute('content', tcColor);

  window.__themeBoot = { KEY: KEY, mq: mq, mode: mode, MODES: MODES };
})();
</script>
<!-- 复用登录页的样式入口：改密页与登录页是同一套卡片外观，不另立色板。 -->
<script type="module" src="/src/login-main.js"></script>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <symbol id="i-theme-auto" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17Z" fill="currentColor"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20.5 14.6A8.6 8.6 0 0 1 9.4 3.5a8.6 8.6 0 1 0 11.1 11.1Z"/></symbol>
    <symbol id="i-github" viewBox="0 0 24 24"><path d="M12 2.2a9.8 9.8 0 0 0-3.1 19.1c.49.09.67-.21.67-.47v-1.86c-2.73.6-3.3-1.17-3.3-1.17-.45-1.13-1.1-1.43-1.1-1.43-.9-.61.07-.6.07-.6 1 .07 1.53 1.02 1.53 1.02.88 1.51 2.32 1.07 2.88.82.09-.64.35-1.08.63-1.33-2.18-.25-4.47-1.09-4.47-4.85 0-1.07.38-1.95 1.02-2.63-.1-.25-.45-1.26.1-2.63 0 0 .83-.27 2.72 1a9.4 9.4 0 0 1 4.94 0c1.89-1.27 2.71-1 2.71-1 .55 1.37.2 2.38.1 2.63.64.68 1.02 1.56 1.02 2.63 0 3.77-2.3 4.6-4.49 4.84.35.31.67.9.67 1.82v2.7c0 .26.18.57.68.47A9.8 9.8 0 0 0 12 2.2Z"/></symbol>
  </svg>

  <form class="login-card" id="changeForm" autocomplete="on" novalidate>
    <button type="button" class="theme-toggle" id="themeBtn" title="主题：跟随系统" aria-label="切换主题">
      <svg class="ico" aria-hidden="true" focusable="false"><use href="#i-theme-auto"/></svg>
    </button>
    <svg class="logo" viewBox="0 0 64 64" role="img" aria-label="笺川"><rect width="64" height="64" rx="15" fill="var(--accent)"/><rect x="8" y="17" width="33" height="37" rx="6" fill="#ffffff"/><rect x="15" y="25" width="19" height="5" rx="2.5" fill="var(--accent)"/><rect x="15" y="35" width="12" height="5" rx="2.5" fill="var(--accent)"/><rect x="15" y="45" width="16" height="5" rx="2.5" fill="var(--accent)"/><path d="M51.5 6 l2.9 7.1 7.1 2.9 -7.1 2.9 -2.9 7.1 -2.9 -7.1 -7.1 -2.9 7.1 -2.9 z" fill="#ffffff"/></svg>
    <h1>设置新密码</h1>
    <p class="sub" id="subText">首次登录需要修改初始密码后才能使用</p>

    <div class="field">
      <label for="current">当前密码</label>
      <input id="current" name="current" type="password" autocomplete="current-password" required >
    </div>
    <div class="field">
      <label for="next">新密码</label>
      <input id="next" name="next" type="password" autocomplete="new-password" required>
    </div>
    <div class="field">
      <label for="next2">确认新密码</label>
      <input id="next2" name="next2" type="password" autocomplete="new-password" required>
    </div>

    <button type="submit" id="submitBtn">保存并进入</button>
    <div class="error" id="error" role="alert" aria-live="assertive"></div>

    <p class="tip">
      初始密码是公开的固定值（<code>Admin2026</code>），改掉之前站点等于没上锁。
      <br>忘记密码可执行 <code>docker exec -it feedlore initial-password --reset</code>
    </p>
  </form>

<script>
  const form = document.getElementById('changeForm');
  const btn = document.getElementById('submitBtn');
  const errBox = document.getElementById('error');
  const subText = document.getElementById('subText');
  let username = '';

  /* ---------- 主题切换：与登录页同一份实现（键名 / 四档模式 / 计算色） ---------- */
  const THEME_KEY = 'feedlore.appearance.v2';
  const THEME_MODES = ['auto', 'light', 'dark', 'github'];
  const THEME_META = {
    auto: { ico: 'i-theme-auto', label: '跟随系统' },
    light: { ico: 'i-sun', label: '浅色' },
    dark: { ico: 'i-moon', label: '暖灰' },
    github: { ico: 'i-github', label: '暗黑' },
  };
  const THEME_DATA_ATTR = { auto: null, light: 'light', dark: 'dark', github: 'github' };
  const themeBtn = document.getElementById('themeBtn');
  const themeUse = themeBtn.querySelector('use');

  function prefersDark() {
    return !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  }
  function readAppearance() {
    try {
      const v = JSON.parse(localStorage.getItem(THEME_KEY) || 'null');
      return v && typeof v === 'object' && !Array.isArray(v) ? v : {};
    } catch (_) { return {}; }
  }
  function currentThemeMode() {
    const m = readAppearance().theme;
    return THEME_MODES.indexOf(m) >= 0 ? m : 'auto';
  }
  function applyTheme(mode) {
    const m = THEME_MODES.indexOf(mode) >= 0 ? mode : 'auto';
    const eff = THEME_DATA_ATTR[m] || (prefersDark() ? 'dark' : 'light');
    const el = document.documentElement;
    el.setAttribute('data-theme', eff);
    el.setAttribute('data-theme-mode', m);
    try {
      const ap = readAppearance();
      ap.theme = m;
      localStorage.setItem(THEME_KEY, JSON.stringify(ap));
    } catch (_) { /* 忽略 */ }
    if (themeUse) themeUse.setAttribute('href', '#' + THEME_META[m].ico);
    themeBtn.title = '主题：' + THEME_META[m].label + '（点击切换）';
    themeBtn.setAttribute('aria-label', '主题：' + THEME_META[m].label);
    const cssBg = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
    const tcColor = cssBg || (eff === 'github' ? '#0d1117' : (eff === 'light' ? '#f4f5f7' : '#242424'));
    document.querySelectorAll('meta[name="theme-color"]').forEach((tc) => tc.setAttribute('content', tcColor));
  }
  themeBtn.addEventListener('click', () => {
    const next = THEME_MODES[(THEME_MODES.indexOf(currentThemeMode()) + 1) % THEME_MODES.length];
    applyTheme(next);
  });
  try {
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
      if (currentThemeMode() === 'auto') applyTheme('auto');
    });
  } catch (_) { /* 老浏览器忽略 */ }
  applyTheme(currentThemeMode());

  /* ---------- 状态守卫 ----------
   * 未登录 → 登录页；已经改过密的人不该停在这里（直接回首页）。
   * 服务端还有一道强制拦截，这个页面只是唯一的放行出口。 */
  function showError(msg) {
    errBox.textContent = msg;
    errBox.classList.remove('show');
    void errBox.offsetWidth;
    errBox.classList.add('show');
  }

  (async function guard() {
    let s = null;
    try {
      s = await fetch('/api/session').then((r) => r.json());
    } catch (_) { /* 网络异常按未登录处理 */ }
    if (!s || !s.authenticated) {
      location.replace('/login.html?next=' + encodeURIComponent('/change-password.html'));
      return;
    }
    if (!s.mustChangePassword) {
      location.replace('/');
      return;
    }
    username = s.username || '';
    subText.textContent = '当前账号 ' + username + ' 首次登录，需要先修改初始密码';
  })();

  form.addEventListener('submit', async (ev) => {
    ev.preventDefault();
    errBox.classList.remove('show');
    const curEl = document.getElementById('current');
    const nextEl = document.getElementById('next');
    const next2El = document.getElementById('next2');

    if (!curEl.value) {
      showError('请输入当前密码（首次部署的初始密码是 Admin2026）');
      curEl.focus();
      return;
    }
    if (nextEl.value.length < 4) {
      showError('新密码至少 4 位');
      nextEl.focus();
      return;
    }
    if (nextEl.value !== next2El.value) {
      showError('两次输入的新密码不一致');
      next2El.focus();
      return;
    }
    if (nextEl.value === curEl.value) {
      showError('新密码不能与初始密码相同');
      nextEl.focus();
      return;
    }

    btn.disabled = true;
    btn.setAttribute('aria-busy', 'true');
    btn.textContent = '保存中…';
    let entering = false;
    try {
      /* 与主站同一套 15s 硬超时：弱网/反代挂起时不能把按钮永远停在「保存中…」。 */
      const signal = (typeof AbortSignal !== 'undefined' && AbortSignal.timeout)
        ? AbortSignal.timeout(15000)
        : undefined;
      const res = await fetch('/api/account', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        signal,
        body: JSON.stringify({ currentPassword: curEl.value, newPassword: nextEl.value }),
      });
      const data = await res.json().catch(() => ({}));
      if (res.ok) {
        entering = true;
        btn.textContent = '正在进入…';
        location.replace('/');
        return;
      }
      showError(window.errText(data, '保存失败'));
    } catch (e) {
      showError((e && e.name === 'TimeoutError')
        ? '保存超时（15 秒无响应），请检查网络后重试'
        : '网络异常，请重试');
    } finally {
      if (!entering) {
        btn.disabled = false;
        btn.removeAttribute('aria-busy');
        btn.textContent = '保存并进入';
      }
    }
  });
</script>
</body>
</html>
