<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<!-- 样式表到达之前，让 UA 按系统深浅决定画布 / 滚动条 / 表单控件的默认色；
     真正生效的主题由下面的内联脚本与 CSS 的 color-scheme 逐套覆盖。 -->
<meta name="color-scheme" content="light dark">
<title>笺川</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<!-- 安装壳（WebAPK）的系统栏颜色取自清单，只在安装 / 后台刷新时重读，页面 CSS 和运行时
     都改不了，所以清单固定用深色（安装壳的底栏恒为深色，不跟主题走）。 -->
<link rel="manifest" href="/manifest.json">
<!-- 首屏 theme-color：JS 还没跑时按系统深浅兜底，深色系统不会先闪一条白。
     两条都带 media：不支持 media 的老浏览器会取第一条（亮色），是安全默认。
     颜色 = 各主题的 --bg（页面真正的顶色）。运行时 syncThemeColor() 会把所有条目改成当前值。 -->
<meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#242424" media="(prefers-color-scheme: dark)">
<!-- 可安装到手机（Edge / Chrome「添加到手机」，iOS「添加到主屏幕」）-->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="笺川">
<meta name="format-detection" content="telephone=no">
<script>
/* 外观偏好：主题模式 + 主色调 + 字号 + 阅读字体 / 行高 / 阅读宽度。
   只存在本机（feedlore.appearance.v2），不跟账号走；新设备一律用全「中」默认。
   必须在样式表之前把这些属性写到 <html> 上，否则首屏会先按默认值画一遍再跳一下。
   取值合法性也在这里兜一层：localStorage 是用户可改的，脏值不该让页面崩掉。 */
(function () {
  var el = document.documentElement;
  var pick = function (v, list, dflt) { return list.indexOf(v) >= 0 ? v : dflt; };
  var ACCENTS = ['blue', 'violet', 'teal', 'green', 'amber', 'rose'];
  var ap = {};
  try { ap = JSON.parse(localStorage.getItem('feedlore.appearance.v2') || 'null') || {}; } catch (e) { ap = {}; }

  var mode = pick(ap.theme, ['auto', 'light', 'dark', 'github'], 'auto');
  el.setAttribute('data-theme-mode', mode);
  // github 是整包主题，不进「跟随系统」；data-theme 直接写 github 走另一套 CSS 变量块
  var mq = window.matchMedia('(prefers-color-scheme: dark)');
  var dark = mode === 'dark' || (mode === 'auto' && mq.matches);
  el.setAttribute('data-theme', mode === 'github' ? 'github' : (dark ? 'dark' : 'light'));

  /* HTML 里两条 <meta theme-color> 只跟系统深浅走；用户显式选了浅色 / 暗色 / GitHub
     时系统偏好不作数，这里按实际主题立刻改写（颜色 = style.css 各主题的 --bg）。
     不改的话：系统深色 + 用户选浅色，首屏会先按深色兜底再被 JS 翻成浅色。 */
  var THEME_COLORS = { light: '#f4f5f7', dark: '#242424', github: '#0d1117' };
  var tcs = document.querySelectorAll('meta[name="theme-color"]');
  var tcColor = THEME_COLORS[el.getAttribute('data-theme')] || '#f4f5f7';
  for (var ti = 0; ti < tcs.length; ti++) tcs[ti].setAttribute('content', tcColor);

  // 主色调：github 主题写死 GitHub 蓝；其余用本机保存的值（无则蓝）
  el.setAttribute('data-accent', mode === 'github' ? 'github' : pick(ap.accent, ACCENTS, 'blue'));

  /* 启动层的主色：样式表此时还没加载，只能在这里按主题取一份十六进制值，
     让 logo 在冷启动第一帧就是用户选中的主色，而不是先蓝一下再跳。 */
  var ACCENT_HEX = {
    blue: ['#1f5ce8', '#7aa2ff'], violet: ['#6a3fe0', '#a68bff'],
    teal: ['#0b6f74', '#4fd1c5'], green: ['#0e7440', '#5ed68f'],
    amber: ['#9a4a06', '#f0b45f'], rose: ['#c0255c', '#ff8fb1']
  };
  var pair = ACCENT_HEX[el.getAttribute('data-accent')] || ACCENT_HEX.blue;
  el.style.setProperty('--boot-accent', mode === 'github' ? '#1f6feb' : (dark ? pair[1] : pair[0]));

  el.setAttribute('data-font-size', pick(ap.fontSize, ['s', 'm', 'l'], 'm'));
  /* 两套列表密度：首屏先落属性，组件本身再从偏好读同一份值；
     默认都是紧凑，首帧和运行时不能一密一松。 */
  el.setAttribute('data-density', pick(ap.density, ['cozy', 'compact'], 'compact'));
  el.setAttribute('data-list-density', pick(ap.listDensity, ['cozy', 'compact'], 'compact'));
  el.setAttribute('data-reader-font', pick(ap.readerFont, ['sans', 'serif'], 'sans'));
  el.setAttribute('data-reader-lh', pick(ap.readerLh, ['s', 'm', 'l'], 'm'));
  el.setAttribute('data-reader-fs', pick(ap.readerFs, ['xs', 's', 'm', 'l', 'xl'], 'm'));
  el.setAttribute('data-reader-width', pick(ap.readerWidth, ['s', 'm', 'l', 'full'], 'm'));
})();
</script>
<!-- 样式表不再手写 <link>：style.css 已移入 src/，由 main.jsx 的 import 引入，
     Vite 会打出带内容哈希的 /assets/style-<hash>.css 并自动注入 <link>。
     此前是固定路径 /style.css，CDN 缓存 1~4 小时而 HTML 总是新的，
     新旧错配会让新增元素完全没有样式（见 src/main.jsx 注释）。 -->
<!-- 加载优先级（v1.5.0）：样式表是首屏渲染的硬阻塞资源。
     Vite 注入的 <link rel=stylesheet> 本身已是最高优先级（渲染阻塞），
     这里不再手写 preload —— 手写 /src/main.jsx 会被 Vite 当成入口直接内联整段代码，
     反而把 HTML 撑大。 -->
<style>
/* 启动层：必须内联在这里。样式表与入口模块都要等网络，冷启动（尤其 ARM 测试机）
   会先白屏几秒；这段 CSS 与下面的标记随 HTML 一起到达，第一帧就有东西可看。
   主题/主色由 head 里的内联脚本预先写到 <html> 与 --boot-accent，
   READY 由 bootstrap.js 在首个视图渲染完成后调用 window.__boot.ready()。 */
#appBoot {
  position: fixed; inset: 0; z-index: 9999;
  display: grid; place-items: center;
  background: #f4f5f7; color: #1b1f26;
  --boot-track: rgba(27, 31, 38, .12);
  --boot-glow: rgba(27, 31, 38, .10);
  --boot-accent: #1f5ce8;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  transition: opacity .26s ease;
}
html[data-theme="dark"] #appBoot {
  background: #242424; color: #c9c9c9;
  --boot-track: rgba(255, 255, 255, .14); --boot-glow: rgba(0, 0, 0, .5);
}
html[data-theme="github"] #appBoot {
  background: #0d1117; color: #f0f6fc;
  --boot-track: rgba(255, 255, 255, .14); --boot-glow: rgba(0, 0, 0, .55);
}
#appBoot.is-done { opacity: 0; pointer-events: none; }
html.boot-lock { overflow: hidden; }
.boot-inner { display: flex; flex-direction: column; align-items: center; gap: 14px; transform: translateY(-2vh); }
.boot-mark { width: 64px; height: 64px; border-radius: 15px; box-shadow: 0 10px 30px var(--boot-glow); animation: bootPulse 1.8s ease-in-out infinite; }
.boot-mark svg { display: block; width: 100%; height: 100%; }
.boot-name { font-size: 13px; letter-spacing: .24em; padding-left: .24em; opacity: .72; }
.boot-bar { width: 92px; height: 3px; border-radius: 3px; background: var(--boot-track); overflow: hidden; }
.boot-bar i { display: block; width: 42%; height: 100%; border-radius: inherit; background: var(--boot-accent); animation: bootSlide 1.15s cubic-bezier(.4, 0, .2, 1) infinite; }
.boot-tip { min-height: 18px; font-size: 12px; opacity: .62; text-align: center; }
.boot-err { display: none; flex-direction: column; align-items: center; gap: 10px; margin-top: 2px; }
#appBoot.is-error .boot-err { display: flex; }
#appBoot.is-error .boot-bar, #appBoot.is-error > .boot-inner > .boot-tip { display: none; }
.boot-retry { font: inherit; font-size: 13px; padding: 7px 16px; border-radius: 8px; border: 1px solid var(--boot-track); background: transparent; color: inherit; cursor: pointer; }
.boot-retry:hover { background: var(--boot-track); }
@keyframes bootPulse { 0%, 100% { transform: scale(1); opacity: .95; } 50% { transform: scale(1.045); opacity: 1; } }
@keyframes bootSlide { 0% { transform: translateX(-110%); } 100% { transform: translateX(260%); } }
@media (prefers-reduced-motion: reduce) {
  .boot-mark, .boot-bar i { animation: none; }
  .boot-bar i { width: 100%; opacity: .5; }
  #appBoot { transition: none; }
}
</style>
</head>
<body>
<!-- 冷启动加载层（详见 <head> 内的注释与脚本）。ready / fail 由 src/core/bootstrap.js 调用 -->
<div id="appBoot" role="status" aria-live="polite" aria-label="正在加载">
  <div class="boot-inner">
    <div class="boot-mark" aria-hidden="true">
      <svg viewBox="0 0 64 64">
        <rect width="64" height="64" rx="15" fill="var(--boot-accent)" />
        <rect x="8" y="17" width="33" height="37" rx="6" fill="#ffffff" />
        <rect x="15" y="25" width="19" height="5" rx="2.5" fill="var(--boot-accent)" />
        <rect x="15" y="35" width="12" height="5" rx="2.5" fill="var(--boot-accent)" />
        <rect x="15" y="45" width="16" height="5" rx="2.5" fill="var(--boot-accent)" />
        <path d="M51.5 6l2.9 7.1 7.1 2.9-7.1 2.9-2.9 7.1-2.9-7.1-7.1-2.9 7.1-2.9z" fill="#ffffff" />
      </svg>
    </div>
    <div class="boot-name">笺川</div>
    <div class="boot-bar" aria-hidden="true"><i></i></div>
    <div class="boot-tip">正在准备你的阅读空间</div>
    <div class="boot-err">
      <div class="boot-tip boot-err-text">加载遇到问题</div>
      <button class="boot-retry" type="button">重新加载</button>
    </div>
  </div>
</div>
<script>
(function () {
  var el = document.getElementById('appBoot');
  if (!el) return;
  var tip = el.querySelector('.boot-tip');
  var errText = el.querySelector('.boot-err-text');
  /* 不用 onclick 内联属性：CSP 只放行带 nonce 的 <script>，内联事件处理器会被拦掉 */
  var retry = el.querySelector('.boot-retry');
  if (retry) retry.addEventListener('click', function () { location.reload(); });
  var t0 = performance.now();
  var done = false;
  var timer;
  document.documentElement.classList.add('boot-lock');
  function dismiss() {
    if (done) return;
    done = true;
    clearTimeout(timer);
    document.documentElement.classList.remove('boot-lock');
    /* 至少显示 350ms：接口很快时也不至于闪一下白/闪一下 logo */
    var wait = Math.max(0, 350 - (performance.now() - t0));
    setTimeout(function () {
      el.classList.add('is-done');
      setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 320);
    }, wait);
  }
  window.__boot = {
    ready: dismiss,
    tip: function (text) { if (text && !done) tip.textContent = text; },
    fail: function (text) {
      if (done) return;
      clearTimeout(timer);
      el.classList.add('is-error');
      errText.textContent = text || '加载遇到问题';
    }
  };
  timer = setTimeout(function () { window.__boot.fail('加载时间超出预期，请检查网络后重试'); }, 12000);
})();
</script>

<!-- v1.6.0：全局顶栏已并入各视图自带的第一行（≡频道 / 标题 / 搜索 / ⋮），
     不再有独立的顶栏 <header> 元素 —— 三视图各自渲染合并后的 Row1 并写入 --topbar-h。 -->

<!-- 卡片：默认隐藏，由 switchView 决定显示哪个页面（默认是「文章」）。内容已 React 化，组件见 src/views/CardsView.jsx，挂载到下面的 #cardsRoot -->
<div id="cardsView" hidden><div id="cardsRoot"></div></div>

<!-- 文章：左频道 / 右文章，点标题展开全文（已 React 化，组件见 src/views/ReaderView.jsx，挂载到 #readerRoot） -->
<div class="wrap reader" id="readerView"><div id="readerRoot"></div></div>

<!-- AI：大模型能力聚合页（已 React 化，组件见 src/ai/AiView.jsx，挂载到下面的 #aiRoot） -->
<div class="wrap" id="aiView" hidden><div id="aiRoot"></div></div>

<!-- 移动端底部视图标签栏（≤720px 显示；桌面 / 平板隐藏，仍用各视图顶栏里的 ViewNav） -->
<div id="mobileTabbarRoot" class="mobile-tabbar"></div>

<!-- 悬浮回顶钮（滚过一屏才出现；挂在这里而不是视图内，避免被头部容器查询困住） -->
<div id="scrollTopRoot"></div>

<!-- 设置弹层（已 React 化，组件见 src/settings/SettingsModal.jsx），挂载到 #settingsRoot -->
<div id="settingsRoot"></div>

<!-- 覆盖层：toast / 「N 条新内容」浮标 / 图片灯箱（已 React 化，组件见 src/ui/Overlays.jsx） -->
<div id="overlaysRoot"></div>

<!-- 命令面板 ⌘K / Ctrl+K（现代化快捷键交互，参考 Linear / Vercel 命令面板）。
     已 React 化：组件见 src/cmdk/CommandPalette.jsx，由 main.jsx 挂载到下面的节点 -->
<div id="cmdkRoot"></div>

<script type="module" src="/src/main.jsx"></script>
