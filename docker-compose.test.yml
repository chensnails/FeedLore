# 笺川（FeedLore）· 试用态 Compose（test 分支镜像 + Watchtower 自动更新）
#
# 三份 compose 的关系：
# - docker-compose.yml            ：本地有源码，现场 --build
# - docker-compose.release.yml    ：生产，跟 ghcr.io 的 :latest / 版本号
# - docker-compose.test.yml       ：试用，跟 ghcr.io 的 :test（push 到 test 分支自动出）
#
# 与 release 版刻意用同一套 project / 容器名 / 卷 / 网络：
# 两者是「二选一」，不是并排跑。切过来时数据库卷（feedlore-pgdata）原样复用，
# 数据零迁移；试完想回生产，down 掉再 up release 版即可，同一份数据。
#
# 用法：
#   1. 已在跑 release 版：docker compose -f docker-compose.release.yml down   （不要删卷）
#   2. docker compose -f docker-compose.test.yml up -d
#      WIN: docker compose -f docker-compose.test.yml --env-file .env up -d
#   3. 之后 test 分支每次 push，CI 出新 :test 镜像，Watchtower 几分钟内自动拉起；
#      也可在「设置 → 关于」点「一键更新」立即触发。
#   4. 回生产：down 后 docker compose -f docker-compose.release.yml up -d
#
# 变量与 release 版一致，.env 直接复用（需要 PG_PASSWORD / WATCHTOWER_HTTP_API_TOKEN）。
name: feedlore

services:
  db:
    image: postgres:18.4-alpine
    container_name: feedlore-db
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      POSTGRES_DB: ${PG_DB:-feedlore}
      POSTGRES_USER: ${PG_USER:-feedlore}
      POSTGRES_PASSWORD: ${PG_PASSWORD:?请先在 .env 中设置 PG_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - feedlore
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  app:
    # 唯一的差别就这一行：跟 test 分支的镜像
    image: ghcr.io/chensnails/feedlore:test
    container_name: feedlore
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      PORT: "3000"
      DATABASE_URL: postgres://${PG_USER:-feedlore}:${PG_PASSWORD}@db:5432/${PG_DB:-feedlore}

      UPDATE_WEBHOOK_URL: ${UPDATE_WEBHOOK_URL:-http://watchtower:8080/v1/update}
      UPDATE_WEBHOOK_TOKEN: ${WATCHTOWER_HTTP_API_TOKEN:?试用态同样需要 WATCHTOWER_HTTP_API_TOKEN}

      SEED_FEEDS: "${SEED_FEEDS:-}"

      REFRESH_MINUTES: ${REFRESH_MINUTES:-30}
      KEEP_PER_FEED: ${KEEP_PER_FEED:-300}
      KEEP_DAYS: ${KEEP_DAYS:-0}
      AUTO_REFRESH_MINUTES: ${AUTO_REFRESH_MINUTES:-0}

      # 大模型 / 每日摘要：v1.4.0 起跟随账号，无环境变量

      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASS: ${ADMIN_PASS:-admin}

    labels:
      - "com.centurylinklabs.watchtower.enable=true"

    ports:
      - "${HOST_PORT:-3210}:3000"

    networks:
      - feedlore

    extra_hosts:
      - "host.docker.internal:host-gateway"

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  watchtower:
    image: containrrr/watchtower:1.7.1
    container_name: feedlore-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      TZ: Asia/Shanghai
      WATCHTOWER_LABEL_ENABLE: "true"
      DOCKER_API_VERSION: "1.44"
      WATCHTOWER_POLL_INTERVAL: "300"
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_HTTP_API_UPDATE: "true"
      WATCHTOWER_HTTP_API_PERIODIC_POLLS: "true"
      WATCHTOWER_HTTP_API_TOKEN: ${WATCHTOWER_HTTP_API_TOKEN:?试用态同样需要 WATCHTOWER_HTTP_API_TOKEN}
    networks:
      - feedlore
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  feedlore:
    name: feedlore
    driver: bridge

volumes:
  pgdata:
    name: feedlore-pgdata
