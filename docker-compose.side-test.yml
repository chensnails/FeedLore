# 笺川（FeedLore）· 本机常驻测试环境（镜像模式，与生产并排，端口 3211）
#
# 与其它几份 compose 的分工：
# - docker-compose.yml            ：源码模式，但用的是生产的容器名/卷/端口（3210）
# - docker-compose.release.yml    ：生产，跟 ghcr 的 :latest
# - 本文件                        ：跟 ghcr 的**预发布**镜像，与生产同时跑、互不影响
#
# 日常走【本地构建】（约 20 秒，不推 tag、不占 ghcr、对已部署实例零影响）：
#   docker build -t feedlore:1.4.0-test1 -t feedlore:test-src .
#   APP_IMAGE=feedlore:test-src docker compose -f docker-compose.side-test.yml up -d
#   两个标签：带版本号的那枚留档可回滚，test-src 是"当前在测"的浮动别名（每次构建覆盖）。
#   回滚到上一版：APP_IMAGE=feedlore:1.4.0-test0 docker compose ... up -d
# 需要跨机复现（或想验 CI 产出的那份）时，才临时钉到预发布镜像：
#   APP_IMAGE=ghcr.io/chensnails/feedlore:1.4.0-test1 \
#     docker compose -f docker-compose.side-test.yml up -d
# 两种模式共用同一数据卷，切换不丢数据；不带 APP_IMAGE 时用 image 那行的默认值。
#
# 用法：
#   docker compose -f docker-compose.side-test.yml up -d           # 用当前镜像
#   docker compose -f docker-compose.side-test.yml logs -f app     # 看后端日志
#   docker compose -f docker-compose.side-test.yml down            # 停掉，保留数据卷
#   打开 http://127.0.0.1:3211 （初始账号 admin / admin；局域网内用本机 IP + 3211）
#
# 两处刻意与生产不同：
#   1. 监听 0.0.0.0（不是 127.0.0.1）：要能从局域网里别的机器打开这个测试站。
#      代价是 admin/admin 这套初始账号也一起暴露在网段里 —— 只在可信网络里这么用，
#      用完记得把前缀改回 127.0.0.1（或换掉管理员密码）。
#   2. 没有 watchtower：钉的是预发布标签，不是 :latest，Watchtower 没有可比对的对象，
#      也就不会把测试站拉回生产版本。「设置 → 关于」的一键更新同样不可用。
name: feedlore-test

services:
  db:
    image: postgres:18.4-alpine
    container_name: feedlore-test-db
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      POSTGRES_DB: ${PG_DB:-feedlore}
      POSTGRES_USER: ${PG_USER:-feedlore}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-feedlore-test-local}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - test-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - feedlore-test
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  app:
    # 镜像模式：默认钉在 CI 产出的预发布镜像上。换版本用 APP_IMAGE 覆盖，不必改本文件。
    # 想改回「跟本地工作区源码」，把下面 build 段取消注释、image 换成 feedlore:test-src。
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    image: ${APP_IMAGE:-ghcr.io/chensnails/feedlore:1.4.0-test1}
    container_name: feedlore-test
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      PORT: "3000"
      DATABASE_URL: postgres://${PG_USER:-feedlore}:${PG_PASSWORD:-feedlore-test-local}@db:5432/${PG_DB:-feedlore}

      SEED_FEEDS: "${SEED_FEEDS:-}"
      REFRESH_MINUTES: ${REFRESH_MINUTES:-30}
      KEEP_PER_FEED: ${KEEP_PER_FEED:-300}
      KEEP_DAYS: ${KEEP_DAYS:-0}
      AUTO_REFRESH_MINUTES: ${AUTO_REFRESH_MINUTES:-0}

      # 大模型 / 每日摘要：v1.4.0 起跟随账号，无环境变量

      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASS: ${ADMIN_PASS:-admin}

    ports:
      - "0.0.0.0:${TEST_HOST_PORT:-3211}:3000"

    networks:
      - feedlore-test

    extra_hosts:
      - "host.docker.internal:host-gateway"

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  feedlore-test:
    name: feedlore-test
    driver: bridge

volumes:
  test-pgdata:
    name: feedlore-test-pgdata
